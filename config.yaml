    # Kaynağın prestiji o haberin değerli olduğunu söylemez; ağırlık yalnızca
    # eşitlik bozucu olarak kullanılır.
    #
    # 2026-09-11 ölçümü — 175 haber tarandı:
    #   Emlakkulisi   50 haber → 16 haber adayı + 4 konu adayı   (asıl kaynak)
    #   AA Ekonomi    30 haber →  1 alakalı
    #   Ekonomim      25 haber →  2 alakalı
    #   Bloomberg HT  20 haber →  1 alakalı (ABD konut fiyatları — kitlemize uzak)
