# API anahtarları .env dosyasında saklanır.
# =========================================================

kurum:
  ad: "EDM Yapı & Gayrimenkul"
  unvan: "Yatırım Ortağınız"
  telefon: "0536 343 41 97"
  telefon_uluslararasi: "+905363434197"
  eposta: "info@edmyapigayrimenkul.com"
  web_sitesi: "https://edmyapigayrimenkul.com"
  adres: "Alibey Mah. Albay Yunus Dirik Cad. Kılıç Apt. No: 58/A, Silivri / İstanbul"
  hizmet_bolgeleri:
    - "Silivri"
    - "İstanbul"
    - "Edirne"
    - "Tekirdağ"
    - "Trakya Geneli"
  sosyal_hesaplar:
    instagram: "edmyapigayrimenkul"
    threads: "edmyapigayrimenkul"
    youtube: "@edmyapigayrimenkul"
    tiktok: "edmyapigayrimenkul"

genel:
  zaman_dilimi: "Europe/Istanbul"
  kayit_saklama_gun: 30
  varsayilan_platformlar:
    - "instagram"
    - "threads"

haberler:
  aktif: true
  gunluk_azami_oneri: 5
  onem_puani_esigi: 7
  haber_yasi_saat: 36
  anahtar_kelimeler:
    - "emlak"
    - "gayrimenkul"
    - "konut"
    - "arsa"
    - "tarla"
    - "tapu"
    - "imar"
    - "kentsel dönüşüm"
    - "konut kredisi"
    - "faiz"
    - "tcmb"
    - "konut fiyat"
    - "kira"
    - "silivri"
    - "trakya"
    - "çorlu"
    - "çerkezköy"
    - "edirne"
    - "tekirdağ"
  kaynaklar:
    # Ağırlık artık ÖNEM PUANINA EKLENMİYOR (bkz. haber_puanlama.py).
    # Kaynağın prestiji o haberin değerli olduğunu söylemez; ağırlık yalnızca
    # eşitlik bozucu olarak kullanılır.
    #
    # 2026-09-11 ölçümü — 175 haber tarandı:
    #   Emlakkulisi   50 haber → 16 haber adayı + 4 konu adayı   (asıl kaynak)
    #   AA Ekonomi    30 haber →  1 alakalı
    #   Ekonomim      25 haber →  2 alakalı
    #   Bloomberg HT  20 haber →  1 alakalı (ABD konut fiyatları — kitlemize uzak)
    #   Hürriyet      100 haber → 0 alakalı  ← ÇIKARILDI
    # Hürriyet'in "Emlak Haberleri" beslemesi aslında emlak taşımıyor:
    # "İTO Firma Sorgulama", "Proforma Fatura Nedir", "Şirket Nasıl Kapatılır".
    - ad: "Emlakkulisi"
      url: "https://www.emlakkulisi.com/rss"
      agirlik: 10
      kategori: "emlak"
    - ad: "Anadolu Ajansı Ekonomi"
      url: "https://www.aa.com.tr/tr/rss/default?cat=ekonomi"
      agirlik: 8
      kategori: "ekonomi"
    - ad: "Ekonomim"
      url: "https://www.ekonomim.com/rss"
      agirlik: 7
      kategori: "ekonomi"
    - ad: "Dünya Gazetesi"
      url: "https://www.dunya.com/rss?dunya"
      agirlik: 7
      kategori: "ekonomi"
    - ad: "NTV Ekonomi"
      url: "https://www.ntv.com.tr/ekonomi.rss"
      agirlik: 6
      kategori: "ekonomi"

ilanlar:
  otomatik_yayin: false # Başlangıçta kapalı; Telegram'dan tek tıkla talep edilince üretilir
  kaynak_dosya: "../site/data/listings.json"
  emlakjet_url: "https://www.emlakjet.com/emlak-ofisleri/edm-yapi-gayrimenkul-1015383"
  slayt_sayisi: 5 # Kapak + 3 Detay/Görsel + Kapanış/Danışman

tasarim:
  en: 1080
  boy: 1350 # 4:5 dikey oranı (Instagram Carousel standardı)
  video_en: 1080
  video_boy: 1920 # 9:16 dikey oranı (Reels / Shorts / TikTok standardı)
  guvenli_pay_dikey: 140
  guvenli_pay_yatay: 60
  # Kapanış Slaytı Tasarım Stili:
  # Seçenekler: editoryal (varsayılan), kartvizit, kitap_afis, split_screen, mimari_pafta, kurucu_mektubu,
  #             paspartu_fotograf, dikey_tipografi, iletisim_terminali, dev_numara, resmi_muhur
  kapanis_stili: "editoryal"
  renkler:
    kirmizi: "#f0000d"
    kirmizi_derin: "#c4030f"
    kirmizi_vurgu: "#ff2233"
    murekkep: "#121316"
    kagit: "#f4f4f3"
    kirec: "#e4e4e1"
    kursun: "#8a8b8f"
    cizgi: "#d6d6d3"
    beyaz: "#ffffff"
  fontlar:
    baslik: "assets/fonts/Fraunces-Variable.ttf"
    metin: "assets/fonts/IBMPlexSans-Variable.ttf"
    kod_veri: "assets/fonts/IBMPlexMono-Regular.ttf"
  logolar:
    amblem: "assets/logos/amblem.png"
    yatay_logo: "assets/logos/logo-yatay.png"
    yatay_logo_acik: "assets/logos/logo-yatay-acik.png"
    slogan: "assets/logos/slogan.png"
    ev_sembol: "assets/logos/ev-sembol.png"
    pin_sembol: "assets/logos/pin-sembol.png"

