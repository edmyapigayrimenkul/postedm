      agirlik: 10
      kategori: "emlak"
    - ad: "Anadolu Ajansı Ekonomi"
      url: "https://www.aa.com.tr/tr/rss/default?cat=ekonomi"
      agirlik: 8
      kategori: "ekonomi"
    - ad: "Ekonomim"
      url: "https://www.ekonomim.com/rss"
      agirlik: 7
      kategori: "ekonomi"
    - ad: "Dünya Gazetesi"
      url: "https://www.dunya.com/rss?dunya"
      agirlik: 7
      kategori: "ekonomi"
    - ad: "NTV Ekonomi"
      url: "https://www.ntv.com.tr/ekonomi.rss"
      agirlik: 6
      kategori: "ekonomi"
    - ad: "TRT Haber Ekonomi"
      # Eski xml_mobile.php adresi 200 dönüp BOŞ besleme veriyordu (Kaynak Sağlığı
      # 22 Eylül'den beri kırmızıydı); güncel RSS adresi bu.
      url: "https://www.trthaber.com/ekonomi_articles.rss"
      agirlik: 8
      kategori: "ekonomi"
    - ad: "Habertürk Ekonomi"
      url: "https://www.haberturk.com/rss/kategori/ekonomi.xml"
      agirlik: 7
      kategori: "ekonomi"
    - ad: "Bloomberg HT"
