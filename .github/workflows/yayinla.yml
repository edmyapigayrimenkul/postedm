name: Paylaşım Yayınla (EDM)

on:
  repository_dispatch:
    types: [yayinla, bot_yonetim, metin_duzenle, ozel_uret, slayt_islem]
  workflow_dispatch:
    inputs:
      tur:
        description: 'İçerik türü (haber/ilan)'
        required: true
        default: 'haber'
      id:
        description: 'Haber ID veya İlan ID'
        required: true
      hedef:
        description: 'Hedef platform (hepsi/ig/threads/video)'
        required: true
        default: 'hepsi'

concurrency:
  group: edm-veritabani-yayin
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    # Takılan tek yayın işi sonraki yayın butonlarını varsayılan 360 dakika boyunca kuyrukta tutmasın.
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bot Yönetimi (Duraklat / Devam Et / Temizle / Kota)
        if: github.event.action == 'bot_yonetim'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESAJ_ID: ${{ github.event.client_payload.mesaj_id }}
          KATEGORI: ${{ github.event.client_payload.kategori }}
          EYLEM: ${{ github.event.client_payload.eylem }}
          SAAT: ${{ github.event.client_payload.saat }}
          ICERIK_ID: ${{ github.event.client_payload.id }}
          ANAHTAR: ${{ github.event.client_payload.anahtar }}
          DEGER: ${{ github.event.client_payload.deger }}
          ADET: ${{ github.event.client_payload.adet }}
        run: |
          if [ "$EYLEM" = "duraklat" ]; then
            python -c "import os; from src.telegram_bot import bot_duraklat; s = os.environ.get('SAAT', ''); bot_duraklat(saat=int(s) if s.isdigit() else 24)"
          elif [ "$EYLEM" = "devam_et" ]; then
            python -c "from src.telegram_bot import bot_devam_et; bot_devam_et()"
          elif [ "$EYLEM" = "tur_temizle" ]; then
            python -c "from src import db, telegram_bot; adet = db.askidaki_onaylari_temizle(); telegram_bot.mesaj_gonder(f'🧹 <b>Askıdaki Onaylar Temizlendi:</b> {adet} adet bekleyen onay iptal edildi.')"
          elif [ "$EYLEM" = "kota_raporu" ] || [ "$EYLEM" = "rapor" ]; then
            python scripts/gunluk_rapor.py
          elif [ "$EYLEM" = "ayar_degistir" ]; then
            python -c "import os; from src import ayar; ayar.ayar_kaydet(os.environ.get('ANAHTAR', ''), os.environ.get('DEGER', ''))"
          elif [ "$EYLEM" = "incele" ]; then
            python -c "import os; from src import telegram_bot; telegram_bot.icerik_incele_gonder(int(os.environ.get('ICERIK_ID', '0')))"
          elif [ "$EYLEM" = "sonpostlar" ]; then
            python -c "from src import telegram_bot; m, b = telegram_bot.son_postlar_raporu(); telegram_bot.mesaj_gonder(m, reply_markup=b)"
          elif [ "$EYLEM" = "havuz" ]; then
            python -c "from src import telegram_bot; telegram_bot.mesaj_gonder(telegram_bot.havuz_mesaji())"
          elif [ "$EYLEM" = "yayin_kontrol" ]; then
            python -c "import os; from src import telegram_bot; m, b = telegram_bot.yayin_kontrol_karti(int(os.environ.get('ICERIK_ID', '0'))); telegram_bot.mesaj_gonder(m, reply_markup=b)"
          elif [ "$EYLEM" = "son_mesaji_sil" ] || [ "$EYLEM" = "mesaj_sil" ]; then
            python -c "import os; from src import telegram_bot; a = os.environ.get('ADET', '1'); telegram_bot.son_mesajlari_sil(adet=int(a) if a.isdigit() else 1)"
          fi


      - name: Yayınla
        if: github.event.action == 'yayinla' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_YEDEK: ${{ secrets.GEMINI_API_KEY_YEDEK }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_URN: ${{ secrets.LINKEDIN_ORGANIZATION_URN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          # Siteye yalnız taslak bırakılır; canlı yayın kararı EDM panelindedir.
          EDM_SITE_ICERIK_AKTARIMI: "1"
          # Dış girdi env ile geçer, run bloğuna gömülmez: ${{ }} kabuktan ÖNCE
          # metne yerleşir; tırnak ya da $(...) içeren bir değer komut olarak çalışır.
          TUR: ${{ github.event.client_payload.tur || inputs.tur || 'haber' }}
          ID: ${{ github.event.client_payload.id || inputs.id || '' }}
          HEDEF: ${{ github.event.client_payload.hedef || inputs.hedef || github.event.client_payload.kanallar || 'hepsi' }}
          MESAJ_ID: ${{ github.event.client_payload.mesaj_id || '' }}
          # hedef=planla: Worker'ın planladığı zaman (yalnızca hatırlatıcı için içeriğe yazılır)
          PLAN_AN: ${{ github.event.client_payload.an || '' }}
        run: |
          python scripts/yayinla.py --tur "$TUR" ${ID:+--id "$ID"} --hedef "$HEDEF" ${MESAJ_ID:+--mesaj-id "$MESAJ_ID"} ${PLAN_AN:+--plan-an "$PLAN_AN"}

      - name: Metin Düzenle (Telegram Reply)
        if: github.event.action == 'metin_duzenle'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_YEDEK: ${{ secrets.GEMINI_API_KEY_YEDEK }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          # Telegram'dan gelen serbest metin ve görünen ad — asla run bloğuna gömülmez.
          MESAJ_ID: ${{ github.event.client_payload.mesaj_id }}
          METIN: ${{ github.event.client_payload.metin }}
          BASAN: ${{ github.event.client_payload.gonderen || '' }}
        run: |
          python scripts/metin_duzenle.py --mesaj-id "$MESAJ_ID" --metin "$METIN" --gonderen "$BASAN"

      - name: Özel İçerik Üretimi (/link veya /ozel)
        if: github.event.action == 'ozel_uret'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_YEDEK: ${{ secrets.GEMINI_API_KEY_YEDEK }}
          GEMINI_API_KEY_YEDEK2: ${{ secrets.GEMINI_API_KEY_YEDEK2 }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          TUR: ${{ github.event.client_payload.tur }}
          URL: ${{ github.event.client_payload.url || '' }}
          METIN: ${{ github.event.client_payload.metin || '' }}
        run: |
          python scripts/ozel_uret.py --tur "$TUR" ${URL:+--url "$URL"} ${METIN:+--metin "$METIN"}

      - name: Slayt Operasyonu (Taşıma / Silme / AI Başlık)
        if: github.event.action == 'slayt_islem'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_YEDEK: ${{ secrets.GEMINI_API_KEY_YEDEK }}
          GEMINI_API_KEY_YEDEK2: ${{ secrets.GEMINI_API_KEY_YEDEK2 }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          EYLEM: ${{ github.event.client_payload.eylem }}
          SIRA: ${{ github.event.client_payload.sira }}
          MESAJ_ID: ${{ github.event.client_payload.mesaj_id || '' }}
        run: |
          python scripts/slayt_islem.py --eylem "$EYLEM" --sira "$SIRA" ${MESAJ_ID:+--mesaj-id "$MESAJ_ID"}

      # SIRA ÖNEMLİ: "Hata bildir" hata kaydını DB'ye (hata_kayitlari) yazar; kayıt gitmeden önce
      # "Veritabanını Kaydet" çalışmalıdır. Aksi hâlde kayıt Actions makinesiyle birlikte kaybolur.
      # Job patlarsa sessiz kalmasın; akıllı hata analizi ve interaktif kurtarma butonları üret
      - name: Hata bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TUR: ${{ github.event.client_payload.tur || inputs.tur || 'haber' }}
          ID: ${{ github.event.client_payload.id || inputs.id || '' }}
          HEDEF: ${{ github.event.client_payload.hedef || inputs.hedef || github.event.client_payload.kanallar || 'hepsi' }}
          MESAJ_ID: ${{ github.event.client_payload.mesaj_id || '' }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python -m src.hata_bildir --islem "Yayınla" --tur "$TUR" --id "$ID" --hedef "$HEDEF" --mesaj-id "$MESAJ_ID" --run-url "$RUN_URL"

      - name: Veritabanını Kaydet
        if: always()
        run: |
          python scripts/db_kaydet.py "db: yayin durumlari guncellendi"

      - name: İptal Bildirimi
        if: cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from src import telegram_bot; telegram_bot.mesaj_gonder('⚠️ <b>Yayın İşlemi İptal Edildi:</b> GitHub Actions kuyruğunda bekleyen işlem başka bir istek tarafından kesildi veya iptal edildi. Lütfen butona tekrar basarak deneyin.')"
