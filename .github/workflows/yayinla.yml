name: Paylaşım Yayınla (EDM)

on:
  repository_dispatch:
    types: [yayinla, bot_yonetim]
  workflow_dispatch:
    inputs:
      tur:
        description: 'İçerik türü (haber/ilan)'
        required: true
        default: 'haber'
      id:
        description: 'Haber ID veya İlan ID'
        required: true
      hedef:
        description: 'Hedef platform (hepsi/ig/threads/video)'
        required: true
        default: 'hepsi'

concurrency:
  group: edm-veritabani
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bot Yönetimi (Duraklat / Devam Et)
        if: github.event.action == 'bot_yonetim'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EYLEM: ${{ github.event.client_payload.eylem }}
          SAAT: ${{ github.event.client_payload.saat }}
        run: |
          if [ "$EYLEM" = "duraklat" ]; then
            python -c "import os; from src.telegram_bot import bot_duraklat; s = os.environ.get('SAAT', ''); bot_duraklat(saat=int(s) if s.isdigit() else 24)"
          elif [ "$EYLEM" = "devam_et" ]; then
            python -c "from src.telegram_bot import bot_devam_et; bot_devam_et()"
          fi

      - name: Yayınla
        if: github.event.action == 'yayinla' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          TUR="${{ github.event.client_payload.tur || inputs.tur || 'haber' }}"
          ID="${{ github.event.client_payload.id || inputs.id || '' }}"
          HEDEF="${{ github.event.client_payload.hedef || inputs.hedef || github.event.client_payload.kanallar || 'hepsi' }}"
          MESAJ_ID="${{ github.event.client_payload.mesaj_id || '' }}"
          python scripts/yayinla.py --tur "$TUR" ${ID:+--id "$ID"} --hedef "$HEDEF" ${MESAJ_ID:+--mesaj-id "$MESAJ_ID"}

      - name: Veritabanını Kaydet
        if: always()
        run: |
          python scripts/db_kaydet.py "db: yayin durumlari guncellendi"

      # Job patlarsa sessiz kalmasın. 8-11 Eylül 2026 arasında bu workflow
      # yedi kez üst üste patladı ve kimse bilmedi — lxml eksikliği ancak
      # elle log okununca bulundu.
      - name: Hata bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          t, c = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (t and c):
              raise SystemExit(0)
          url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", timeout=20, json={
              "chat_id": c, "parse_mode": "HTML",
              "text": f"🔴 <b>{'Yayınla'} BAŞARISIZ</b>\n\n"
                      f'<a href="{url}">Log</a>',
          })
          PY
