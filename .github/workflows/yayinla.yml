name: Paylaşım Yayınla (EDM)

on:
  repository_dispatch:
    types: [yayinla]
  workflow_dispatch:
    inputs:
      tur:
        description: 'İçerik türü (haber/ilan)'
        required: true
        default: 'haber'
      id:
        description: 'Haber ID veya İlan ID'
        required: true
      hedef:
        description: 'Hedef platform (hepsi/ig/threads/video)'
        required: true
        default: 'hepsi'

concurrency:
  group: edm-veritabani
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Yayınla
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          TUR="${{ github.event.client_payload.tur || inputs.tur }}"
          ID="${{ github.event.client_payload.id || inputs.id }}"
          HEDEF="${{ github.event.client_payload.hedef || inputs.hedef }}"
          python scripts/yayinla.py --tur "$TUR" --id "$ID" --hedef "$HEDEF"

      - name: Veritabanını Kaydet
        run: |
          python scripts/db_kaydet.py "db: yayin durumlari guncellendi"

      # Job patlarsa sessiz kalmasın. 8-11 Eylül 2026 arasında bu workflow
      # yedi kez üst üste patladı ve kimse bilmedi — lxml eksikliği ancak
      # elle log okununca bulundu.
      - name: Hata bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          t, c = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (t and c):
              raise SystemExit(0)
          url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", timeout=20, json={
              "chat_id": c, "parse_mode": "HTML",
              "text": f"🔴 <b>{'Yayınla'} BAŞARISIZ</b>\n\n"
                      f'<a href="{url}">Log</a>',
          })
          PY
