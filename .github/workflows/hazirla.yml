name: Paylaşım Hazırla (EDM)

on:
  schedule:
    # 1. Her gün sabah 10:00 TR (UTC 07:00): Slot 1 Bilgilendirici (Rotasyon: Nedir Doğrusu / Vaka / Net Cevap / B1)
    - cron: '0 7 * * *'
    # 2. Her gün öğle 13:30 TR (UTC 10:30): Slot 2 Sözlük (EDM Emlak Sözlüğü)
    - cron: '30 10 * * *'
    # 3. Her gün akşam 18:30 TR (UTC 15:30): Slot 3 Haber & Gündem (Haber yoksa otomatik Bilgilendiriciye fallback)
    - cron: '30 15 * * *'
    # Cumartesi 08:00 TR — beslemeden konu adayı madenciliği (paylaşım yapmaz)
    - cron: '0 5 * * 6'
  workflow_dispatch:
    inputs:
      hedef:
        description: 'Çalışma modu'
        required: true
        default: 'slot_bilgilendirici'
        type: choice
        options:
          - slot_bilgilendirici
          - slot_sozluk
          - slot_haber
          - reels
          - finans
          - ilan_menusu
          - konu_madenle
  repository_dispatch:
    types: [sabah_hazirla, slot_hazirla, finans_hazirla, reels_hazirla, ilan_menusu, hazirla_ilan, format_donustur]

concurrency:
  group: edm-veritabani
  cancel-in-progress: false

jobs:
  hazirla:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: İlan Menüsü Gönder
        if: github.event.action == 'ilan_menusu' || inputs.hedef == 'ilan_menusu'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/hazirla.py --ilan-menu

      - name: Belirli İlanı Hazırla
        if: github.event.action == 'hazirla_ilan'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python -c "from src.telegram_bot import ilan_postunu_hazirla_ve_sor; ilan_postunu_hazirla_ve_sor('${{ github.event.client_payload.ilan_id }}')"

      # Format dönüştürme (Kullanıcı Telegram'dan farklı bir formata çevirirse)
      - name: Format Dönüştür ve Onaya Sun
        if: github.event.action == 'format_donustur'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python scripts/hazirla.py --format-degistir "${{ github.event.client_payload.haber_id }}" --format "${{ github.event.client_payload.format_turu }}"

      # Günlük 3 Slot İçeriği (Slot 1 Bilgilendirici / Slot 2 Sözlük / Slot 3 Haber + Fallback)
      - name: Günlük İçerik Hazırla ve Paylaş
        if: >-
          (github.event_name == 'schedule' && (github.event.schedule == '0 7 * * *' || github.event.schedule == '30 10 * * *' || github.event.schedule == '30 15 * * *'))
          || inputs.hedef == 'slot_bilgilendirici' || inputs.hedef == 'slot_sozluk' || inputs.hedef == 'slot_haber' || inputs.hedef == 'gunluk' || inputs.hedef == 'finans' || inputs.hedef == 'reels' || inputs.hedef == 'haber'
          || github.event.action == 'sabah_hazirla' || github.event.action == 'slot_hazirla' || github.event.action == 'finans_hazirla' || github.event.action == 'reels_hazirla'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          SLOT="${{ github.event.client_payload.slot }}"
          FORMAT="${{ github.event.client_payload.format_turu }}"
          if [ -n "$SLOT" ]; then
            python scripts/hazirla.py --slot "$SLOT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            python scripts/hazirla.py --slot bilgilendirici
          elif [ "${{ github.event.schedule }}" = "30 10 * * *" ]; then
            python scripts/hazirla.py --slot sozluk
          elif [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
            python scripts/hazirla.py --slot haber
          elif [ "${{ inputs.hedef }}" = "slot_bilgilendirici" ]; then
            python scripts/hazirla.py --slot bilgilendirici
          elif [ "${{ inputs.hedef }}" = "slot_sozluk" ]; then
            python scripts/hazirla.py --slot sozluk
          elif [ "${{ inputs.hedef }}" = "slot_haber" ] || [ "${{ inputs.hedef }}" = "haber" ]; then
            python scripts/hazirla.py --slot haber
          elif [ "${{ inputs.hedef }}" = "reels" ] || [ "$FORMAT" = "reels" ]; then
            python scripts/hazirla.py --reels
          elif [ "${{ inputs.hedef }}" = "finans" ] || [ "$FORMAT" = "finans" ]; then
            python scripts/hazirla.py --finans --oto-yayin
          elif [ -n "$FORMAT" ]; then
            python scripts/hazirla.py --format "$FORMAT"
          else
            python scripts/hazirla.py --slot bilgilendirici
          fi

      # Haftalık konu madenciliği: beslemedeki rehber içerikten konu adayı çıkarır.
      # Paylaşım yapmaz; konu bankasının ömrünü uzatır (ICERIK-SISTEMI.md §5.7).
      - name: Konu Adaylarını Madenle
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 6')
          || inputs.hedef == 'konu_madenle'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/hazirla.py --konu-madenle

      - name: Veritabanını Kaydet
        if: always()
        run: |
          python scripts/db_kaydet.py "db: haber ve ilan durumlari guncellendi"

      # Job patlarsa sessiz kalmasın. 8-11 Eylül 2026 arasında bu workflow
      # yedi kez üst üste patladı ve kimse bilmedi — lxml eksikliği ancak
      # elle log okununca bulundu.
      - name: Hata bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          t, c = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (t and c):
              raise SystemExit(0)
          url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", timeout=20, json={
              "chat_id": c, "parse_mode": "HTML",
              "text": f"🔴 <b>{'Paylaşım Hazırla'} BAŞARISIZ</b>\n\n"
                      f'<a href="{url}">Log</a>',
          })
          PY
