name: Paylaşım Hazırla (EDM)

on:
  schedule:
    # Türkiye saatiyle 10:00, HAFTA İÇİ (UTC 07:00, Pzt-Cum).
    # Takvim haftada 5 paylaşım öngörüyor (ICERIK-SISTEMI.md §8); eski ayar
    # günde iki kez ve 7 gün çalışıyordu — haftada 14 tetikleme demekti.
    # Gün seçimi önemli: konu_bankasi.TAKVIM hangi sütunun sırası olduğunu
    # haftanın gününden okuyor.
    - cron: '0 7 * * 1-5'
    # Cumartesi 08:00 TR — beslemeden konu adayı madenciliği (paylaşım yapmaz)
    - cron: '0 5 * * 6'
  workflow_dispatch:
    inputs:
      hedef:
        description: 'Çalışma modu'
        required: true
        default: 'gunluk'
        type: choice
        options:
          - gunluk
          - haber
          - ilan_menusu
          - konu_madenle
  repository_dispatch:
    types: [sabah_hazirla, ilan_menusu, hazirla_ilan, format_donustur]

concurrency:
  group: edm-veritabani
  cancel-in-progress: false

jobs:
  hazirla:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: İlan Menüsü Gönder
        if: github.event.action == 'ilan_menusu' || inputs.hedef == 'ilan_menusu'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/hazirla.py --ilan-menu

      - name: Belirli İlanı Hazırla
        if: github.event.action == 'hazirla_ilan'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python -c "from src.telegram_bot import ilan_postunu_hazirla_ve_sor; ilan_postunu_hazirla_ve_sor('${{ github.event.client_payload.ilan_id }}')"

      # Format dönüştürme (Kullanıcı Telegram'dan farklı bir formata çevirirse)
      - name: Format Dönüştür ve Onaya Sun
        if: github.event.action == 'format_donustur'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python scripts/hazirla.py --format-degistir "${{ github.event.client_payload.haber_id }}" --format "${{ github.event.client_payload.format_turu }}"

      # Günlük içerik: önce haber triyajı, geçen yoksa konu bankası.
      # DİKKAT: burada `--haber-tara` KULLANILMAZ. O bayrak "sadece habere bak,
      # konu bankasına başvurma" demek; cron onunla çalışınca triyajı geçen
      # haber olmadığı günlerde hiçbir şey paylaşılmıyordu.
      - name: Günlük İçerik Hazırla ve Onaya Sun
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1-5')
          || inputs.hedef == 'gunluk' || inputs.hedef == 'haber'
          || github.event.action == 'sabah_hazirla'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          FORMAT="${{ github.event.client_payload.format_turu }}"
          if [ -n "$FORMAT" ]; then
            python scripts/hazirla.py --format "$FORMAT"
          else
            python scripts/hazirla.py
          fi

      # Haftalık konu madenciliği: beslemedeki rehber içerikten konu adayı çıkarır.
      # Paylaşım yapmaz; konu bankasının ömrünü uzatır (ICERIK-SISTEMI.md §5.7).
      - name: Konu Adaylarını Madenle
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 6')
          || inputs.hedef == 'konu_madenle'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/hazirla.py --konu-madenle

      - name: Veritabanını Kaydet
        run: |
          python scripts/db_kaydet.py "db: haber ve ilan durumlari guncellendi"

      # Job patlarsa sessiz kalmasın. 8-11 Eylül 2026 arasında bu workflow
      # yedi kez üst üste patladı ve kimse bilmedi — lxml eksikliği ancak
      # elle log okununca bulundu.
      - name: Hata bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          t, c = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (t and c):
              raise SystemExit(0)
          url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", timeout=20, json={
              "chat_id": c, "parse_mode": "HTML",
              "text": f"🔴 <b>{'Paylaşım Hazırla'} BAŞARISIZ</b>\n\n"
                      f'<a href="{url}">Log</a>',
          })
          PY
