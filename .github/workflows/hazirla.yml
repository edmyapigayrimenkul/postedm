name: Paylaşım Hazırla (EDM)

on:
  schedule:
    # Türkiye saatiyle 10:00 ve 16:00 (UTC 07:00 ve 13:00)
    - cron: '0 7,13 * * *'
  workflow_dispatch:
    inputs:
      hedef:
        description: 'Çalışma modu'
        required: true
        default: 'haber'
        type: choice
        options:
          - haber
          - ilan_menusu
  repository_dispatch:
    types: [sabah_hazirla, ilan_menusu, hazirla_ilan]

concurrency:
  group: edm-veritabani
  cancel-in-progress: false

jobs:
  hazirla:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: İlan Menüsü Gönder
        if: github.event.action == 'ilan_menusu' || inputs.hedef == 'ilan_menusu'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/hazirla.py --ilan-menu

      - name: Belirli İlanı Hazırla
        if: github.event.action == 'hazirla_ilan'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python -c "from src.telegram_bot import ilan_postunu_hazirla_ve_sor; ilan_postunu_hazirla_ve_sor('${{ github.event.client_payload.ilan_id }}')"

      - name: Haber Tara ve Onaya Sun
        if: github.event_name == 'schedule' || inputs.hedef == 'haber'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python scripts/hazirla.py --haber-tara

      - name: Veritabanını Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/edm.db
          git diff --staged --quiet || git commit -m "db: haber ve ilan durumlari guncellendi [skip ci]"
          git push
