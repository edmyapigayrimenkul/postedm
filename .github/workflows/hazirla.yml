name: Paylaşım Hazırla (EDM)

on:
  schedule:
    # GÜNDE TEK İÇERİK (2026-09-24 kararı; önceden 10:00 / 13:30 / 18:30 üç slot vardı).
    # ⚠️ ASIL TETİKLEYİCİ CLOUDFLARE CRON'U (2026-10-12): GitHub `schedule` koşuları 6-10 saat gecikiyordu
    # (07:00 UTC içeriği 16:37'de, 09:30 sözlüğü 19:13'te çalıştı). Worker aynı saatlerde `slot_hazirla`
    # (payload: slot, zamanli) yollar. Aşağıdaki iki cron GECİKMELİ YEDEKTİR: Worker o gün çalışmışsa
    # hazirla.py aynı slotu ikinci kez üretmez (ayarlar › zamanli_slot_son_gun:<slot>), çalışmamışsa içerik geç de olsa çıkar.
    # 10:00 TR (UTC 07:00): format dört günlük döngüde döner — B1, Nedir Doğrusu,
    # Net Cevap, B1 (sözlük döngüde YOK: aşağıda 12:30'da ayrı). Haberler içerikten bağımsız: haber-oneri.yml.
    - cron: '0 7 * * *'
    # HER GÜN ÖĞLEN SÖZLÜK KARTI (12:30 TR / UTC 09:30) - TAM OTOMATİK YAYIN
    - cron: '30 9 * * *'
    # Cumartesi 08:00 TR — beslemeden konu adayı madenciliği (paylaşım yapmaz)
    - cron: '0 5 * * 6'
  workflow_dispatch:
    inputs:
      hedef:
        description: 'Çalışma modu'
        required: true
        default: 'slot_bilgilendirici'
        type: choice
        options:
          - slot_bilgilendirici
          - slot_sozluk
          - slot_haber
          - reels
          - finans
          - ilan_menusu
          - konu_madenle
  repository_dispatch:
    types: [sabah_hazirla, slot_hazirla, finans_hazirla, reels_hazirla, ilan_menusu, hazirla_ilan, format_donustur, haber_uret]

concurrency:
  group: edm-veritabani
  cancel-in-progress: false

jobs:
  hazirla:
    runs-on: ubuntu-latest
    # Takılan tek iş `edm-veritabani` grubunu varsayılan 360 dakika kilitlemesin
    # (en uzun yol: üretim + seslendirme + otomatik yayın alt süreci 15 dk).
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: İlan Menüsü Gönder
        if: github.event.action == 'ilan_menusu' || inputs.hedef == 'ilan_menusu'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/hazirla.py --ilan-menu

      - name: Belirli İlanı Hazırla
        if: github.event.action == 'hazirla_ilan'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_YEDEK: ${{ secrets.GEMINI_API_KEY_YEDEK }}
          GEMINI_API_KEY_YEDEK2: ${{ secrets.GEMINI_API_KEY_YEDEK2 }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          # Kapak fotoğrafı konuya göre Pexels'ten (secret yoksa yerel havuz)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Onay videosu seslendirmesi (secret yoksa video yalnız müzikle çıkar)
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Dış girdi env ile geçer; run bloğuna (hele Python kaynağına) gömülmez.
          ILAN_ID: ${{ github.event.client_payload.ilan_id }}
        run: |
          python -c "import os; from src.telegram_bot import ilan_postunu_hazirla_ve_sor; ilan_postunu_hazirla_ve_sor(os.environ['ILAN_ID'])"

      # Format dönüştürme (Kullanıcı Telegram'dan farklı bir formata çevirirse)
      - name: Format Dönüştür ve Onaya Sun
        if: github.event.action == 'format_donustur'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_YEDEK: ${{ secrets.GEMINI_API_KEY_YEDEK }}
          GEMINI_API_KEY_YEDEK2: ${{ secrets.GEMINI_API_KEY_YEDEK2 }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          # Kapak fotoğrafı konuya göre Pexels'ten (secret yoksa yerel havuz)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Onay videosu seslendirmesi (secret yoksa video yalnız müzikle çıkar)
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          HABER_ID: ${{ github.event.client_payload.haber_id }}
          FORMAT: ${{ github.event.client_payload.format_turu }}
        run: |
          python scripts/hazirla.py --format-degistir "$HABER_ID" --format "$FORMAT"

      # Önerilen haber(ler) "📝 İçeriğe çevir" ya da "▶️ Hazırla" ile seçildi: triyaj + içerik + onay
      - name: Haberden İçerik Hazırla
        if: github.event.action == 'haber_uret'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_YEDEK: ${{ secrets.GEMINI_API_KEY_YEDEK }}
          GEMINI_API_KEY_YEDEK2: ${{ secrets.GEMINI_API_KEY_YEDEK2 }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          # Kapak fotoğrafı konuya göre Pexels'ten (secret yoksa yerel havuz)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Onay videosu seslendirmesi (secret yoksa video yalnız müzikle çıkar)
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          # Dış girdi env ile geçer; run bloğuna gömülmez
          HABER_ID: ${{ github.event.client_payload.haber_id }}
        run: |
          # Tek kimlik ya da öneri listesinden seçilenler: "272" / "272,273,275"
          case "$HABER_ID" in (''|*[!0-9,]*|,*|*,|*,,*) echo "Geçersiz haber kimliği"; exit 1;; esac
          python scripts/hazirla.py --haberden "$HABER_ID"

      # Günün tek içeriği (ve elle tetiklenen format / slot istekleri)
      - name: Günlük İçerik Hazırla ve Paylaş
        if: >-
          (github.event_name == 'schedule' && (github.event.schedule == '0 7 * * *' || github.event.schedule == '30 9 * * *'))
          || inputs.hedef == 'slot_bilgilendirici' || inputs.hedef == 'slot_sozluk' || inputs.hedef == 'slot_haber' || inputs.hedef == 'gunluk' || inputs.hedef == 'finans' || inputs.hedef == 'reels' || inputs.hedef == 'haber'
          || github.event.action == 'sabah_hazirla' || github.event.action == 'slot_hazirla' || github.event.action == 'finans_hazirla' || github.event.action == 'reels_hazirla'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_YEDEK: ${{ secrets.GEMINI_API_KEY_YEDEK }}
          GEMINI_API_KEY_YEDEK2: ${{ secrets.GEMINI_API_KEY_YEDEK2 }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          # Kapak fotoğrafı konuya göre Pexels'ten (secret yoksa yerel havuz)
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Onay videosu seslendirmesi (secret yoksa video yalnız müzikle çıkar)
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          SLOT: ${{ github.event.client_payload.slot }}
          FORMAT: ${{ github.event.client_payload.format_turu }}
          HEDEF: ${{ inputs.hedef }}
          ZAMANLAMA: ${{ github.event.schedule }}
          # Zamanlanmış koşu = GitHub cron'u (yedek) YA DA Cloudflare cron'unun yolladığı slot_hazirla (asıl; payload.zamanli).
          # Zamanlanmış koşu bot duraklatılmışsa çalışmaz ve aynı slot aynı günde ikinci kez üretilmez (hazirla.py);
          # elle tetiklenenler (Telegram butonu, workflow_dispatch) duraklatmayı da günlük korumayı da aşar.
          ZAMANLANMIS: ${{ github.event_name == 'schedule' || github.event.client_payload.zamanli == true }}
          # Sözlük kartı: her gün 12:30 çalıştırması `--oto-yayin` ile ONAYSIZ yayınlar (değişken tanımsız/boşken de AÇIK).
          # ACİL FREN: GitHub → Settings → Secrets and variables → Actions → Variables → SOZLUK_OTO_YAYIN = 0
          # (kart o gün Telegram'da onaya düşer). Tekrar açmak için değişkeni sil. Koşullar: ICERIK-SISTEMI.md §5.5.2.
          SOZLUK_OTO_YAYIN: ${{ vars.SOZLUK_OTO_YAYIN }}
        run: |
          if [ -n "$FORMAT" ]; then
            if [ "$FORMAT" = "reels" ]; then
              python scripts/hazirla.py --reels
            elif [ "$FORMAT" = "finans" ]; then
              python scripts/hazirla.py --finans --oto-yayin
            elif [ "$FORMAT" = "sozluk" ]; then
              python scripts/hazirla.py --slot sozluk --oto-yayin
            else
              python scripts/hazirla.py --format "$FORMAT"
            fi
          elif [ -n "$SLOT" ]; then
            if [ "$SLOT" = "sozluk" ]; then
              python scripts/hazirla.py --slot sozluk --oto-yayin
            else
              python scripts/hazirla.py --slot "$SLOT"
            fi
          elif [ "$ZAMANLAMA" = "0 7 * * *" ]; then
            python scripts/hazirla.py --slot bilgilendirici
          elif [ "$ZAMANLAMA" = "30 9 * * *" ]; then
            python scripts/hazirla.py --slot sozluk --oto-yayin
          elif [ "$HEDEF" = "slot_bilgilendirici" ]; then
            python scripts/hazirla.py --slot bilgilendirici
          elif [ "$HEDEF" = "slot_sozluk" ]; then
            python scripts/hazirla.py --slot sozluk --oto-yayin
          elif [ "$HEDEF" = "slot_haber" ] || [ "$HEDEF" = "haber" ]; then
            python scripts/hazirla.py --slot haber
          elif [ "$HEDEF" = "reels" ]; then
            python scripts/hazirla.py --reels
          elif [ "$HEDEF" = "finans" ]; then
            python scripts/hazirla.py --finans --oto-yayin
          else
            python scripts/hazirla.py --slot bilgilendirici
          fi

      # Haftalık konu madenciliği: beslemedeki rehber içerikten konu adayı çıkarır.
      # Paylaşım yapmaz; konu bankasının ömrünü uzatır (ICERIK-SISTEMI.md §5.7).
      - name: Konu Adaylarını Madenle
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 6')
          || inputs.hedef == 'konu_madenle'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_YEDEK: ${{ secrets.GEMINI_API_KEY_YEDEK }}
          GEMINI_API_KEY_YEDEK2: ${{ secrets.GEMINI_API_KEY_YEDEK2 }}
          ZAMANLANMIS: ${{ github.event_name == 'schedule' }}
        run: |
          python scripts/hazirla.py --konu-madenle

      - name: Veritabanını Kaydet
        if: always()
        run: |
          python scripts/db_kaydet.py "db: haber ve ilan durumlari guncellendi"

      # Job patlarsa sessiz kalmasın. 8-11 Eylül 2026 arasında bu workflow
      # yedi kez üst üste patladı ve kimse bilmedi — lxml eksikliği ancak
      # elle log okununca bulundu.
      - name: Hata bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          t, c = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (t and c):
              raise SystemExit(0)
          url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", timeout=20, json={
              "chat_id": c, "parse_mode": "HTML",
              "text": f"🔴 <b>{'Paylaşım Hazırla'} BAŞARISIZ</b>\n\n"
                      f'<a href="{url}">Log</a>',
          })
          PY
