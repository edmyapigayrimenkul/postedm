# =========================================================
#  GÜNLÜK RAPOR
#
#  Bu sistemin en sık hata sınıfı "kod çalıştı ama iş yapılmadı ve kimse
#  bilmedi". 8-11 Eylül arasında hazırlama işi yedi kez üst üste patladı
#  ve üç gün fark edilmedi.
#
#  Rapor bunun panzehiri: her sabah dün ne olduğunu yazıyor. Sessiz
#  bozulmalar birikmeden görünür oluyor.
#
#  05:40 UTC = 08:40 TR — kaynak sağlığından (09:30) ve içerik turundan
#  (10:00) önce. Güne durum özetiyle başlanıyor.
#
#  ⚠️ Bu job uyarı içerse bile YEŞİL kalır. Her sabah kırmızı gören
#  insan kırmızıya körleşir; gerçek arıza o zaman kaybolur.
#
#  2026-10-13: ASIL tetikleyici Cloudflare cron'u (Worker `repository_dispatch` "rapor" + {slot: rapor, zamanli: true}, 08:40 TR):
#  GitHub `schedule` koşuları 6-10 saat gecikiyor, "sabah raporu" öğleden sonra geliyordu. Aşağıdaki cron GECİKMELİ YEDEKTİR;
#  Worker o gün çalıştıysa "Zamanlı koruma" adımı raporu ikinci kez üretmez (scripts/zamanli_koruma.py). Telegram'ın
#  /rapor ve /kota komutları `zamanli` taşımaz (`kategori`/`mesaj_id` taşır): elle istek sayılır, korumaya takılmaz.
# =========================================================

name: Günlük Rapor

on:
  workflow_dispatch:
  repository_dispatch:
    types: [rapor]

concurrency:
  group: edm-veritabani
  cancel-in-progress: false

jobs:
  rapor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Actions kullanımını okumak için. Olmadan API 403 dönüyor ve rapor
      # (eski sürümde) uydurma "125 dk harcandı" sayısı gösteriyordu.
      actions: read
    timeout-minutes: 10
    env:
      ZAMANLANMIS: ${{ github.event.client_payload.zamanli == true }}
      ZAMANLI_SLOT: rapor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Zamanlı koruma (günde bir kez)
        id: koruma
        run: python scripts/zamanli_koruma.py kontrol

      - name: Sessiz metrik topla (Instagram Insights + günlük takipçi)
        if: steps.koruma.outputs.atla != 'true'
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          # Takipçi sayıları kanal başına (src/takipci.py)
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # İzin (#10) eksikse gruba uyarı gider; ölçüm körlüğü 12 gün fark edilmedi.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/metrik_topla.py

      - name: Durumu raporla
        if: steps.koruma.outputs.atla != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESAJ_ID: ${{ github.event.client_payload.mesaj_id }}
          KATEGORI: ${{ github.event.client_payload.kategori }}
          # Jeton satırları artık sabit "Aktif ✓" değil, gerçekten deneniyor
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/gunluk_rapor.py

      - name: Zamanlı işi işaretle
        if: success() && steps.koruma.outputs.atla != 'true'
        run: python scripts/zamanli_koruma.py isaretle

      - name: Veritabanını Kaydet
        if: always()
        run: |
          python scripts/db_kaydet.py "db: gunluk metrikler ve durum guncellendi"

      - name: Hata bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          t, c = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (t and c): raise SystemExit(0)
          url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", timeout=20, json={
              "chat_id": c, "parse_mode": "HTML",
              "text": f'🔴 <b>Günlük rapor BAŞARISIZ</b>\n\n<a href="{url}">Log</a>'})
          PY
