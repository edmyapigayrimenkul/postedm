# =========================================================
#  HABER ÖNERİSİ
#
#  2026-09-24 kararı: içerik günde BİR (hazirla.yml, 10:00 TR); emlak
#  haberleri ondan bağımsız, günde dört kez taranıp Telegram'a ÖNERİ
#  olarak düşer — başlık, kaynak, yayın tarihi ("3 saat önce") ve iki
#  düğmeyle: "📝 İçeriğe çevir" (hazirla.yml → haber_uret) ve "✖ Geç".
#  İçerik üretmez; hangi haberin içeriğe çevrileceğine insan karar verir.
#
#  2026-09-26 kararı: Instabot'un öneri taslağıyla aynı — günde İKİ tur, tek
#  mesajda en fazla beş numaralı başlık; numaralarla çoklu seçim, "▶️ Hazırla"
#  seçilenleri sırayla içeriğe çevirir (hazirla.yml → haber_uret "272,273").
#  🔍 / /incele mevcut inceleme yolundan gider (yayinla.yml › bot_yonetim):
#  kayıt işlenmemiş haberse haber ayrıntısı, içerikse içerik kartı gelir.
#
#  Saatler TR: 09:17 ve 18:17. Dakika :17 — GitHub cron'ları tam saatte
#  yığılıyor ve gecikiyor. Telegram'dan /haber aynı işi hemen yapar.
#
#  Kota: 2 koşu/gün × ~2 dk ≈ 120 dk/ay.
#
#  2026-10-13: ASIL tetikleyici Cloudflare cron'u (Worker `repository_dispatch` "haber_oneri" + {slot, zamanli: true}, aynı saatlerde):
#  GitHub `schedule` koşuları 6-10 saat gecikiyor. Aşağıdaki iki cron GECİKMELİ YEDEKTİR; Worker o gün çalıştıysa
#  "Zamanlı koruma" adımı aynı turu ikinci kez çalıştırmaz (scripts/zamanli_koruma.py). Telegram'ın /haber ve "hızlı üret"
#  düğmeleri `zamanli` taşımaz: elle istek sayılır, `--slot haber` yoluna gider ve korumaya takılmaz.
# =========================================================

name: Haber Önerisi

on:
  schedule:
    - cron: "17 6 * * *"    # 09:17 TR → slot haber_oneri_sabah
    - cron: "17 15 * * *"   # 18:17 TR → slot haber_oneri_aksam
  repository_dispatch:
    types: [haber_oneri]
  workflow_dispatch:

# Veritabanına yazar (öneri durumu + günlük sayaç): içerik akışlarıyla aynı kuyruk
concurrency:
  group: edm-veritabani
  cancel-in-progress: false

jobs:
  oneri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      ZAMANLANMIS: ${{ github.event_name == 'schedule' || github.event.client_payload.zamanli == true }}
      ZAMANLI_SLOT: ${{ github.event.client_payload.slot || (github.event.schedule == '17 15 * * *' && 'haber_oneri_aksam' || 'haber_oneri_sabah') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Zamanlı koruma (günde bir kez)
        id: koruma
        run: python scripts/zamanli_koruma.py kontrol

      - name: Haberleri tara ve öner
        if: steps.koruma.outputs.atla != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Elle = Telegram düğmesi/komutu ya da workflow_dispatch. Zamanlanmış koşu (GitHub cron'u ya da Worker'ın zamanli yükü) elle sayılmaz.
          ELLE: ${{ github.event_name != 'schedule' && github.event.client_payload.zamanli != true }}
        run: |
          if [ "$ELLE" = "true" ]; then
            python scripts/hazirla.py --slot haber
          else
            python scripts/hazirla.py --haber-oneri
          fi

      - name: Zamanlı işi işaretle
        if: success() && steps.koruma.outputs.atla != 'true'
        run: python scripts/zamanli_koruma.py isaretle

      - name: Veritabanını Kaydet
        if: always()
        run: |
          python scripts/db_kaydet.py "db: haber onerileri guncellendi"

      - name: Hata bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          t, c = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (t and c):
              raise SystemExit(0)
          url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", timeout=20, json={
              "chat_id": c, "parse_mode": "HTML",
              "text": f"🔴 <b>{'Haber Önerisi'} BAŞARISIZ</b>\n\n"
                      f'<a href="{url}">Log</a>',
          })
          PY
