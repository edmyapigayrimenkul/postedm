name: Onay Hatırlatıcı (EDM)

on:
  schedule:
    # 1. Öğleden sonra 13:30 TR (UTC 10:30)
    - cron: '30 10 * * *'
    # 2. Akşam 21:30 TR (UTC 18:30)
    - cron: '30 18 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [hatirlat]

concurrency:
  group: edm-veritabani
  cancel-in-progress: false

jobs:
  hatirlat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hatırlatıcıyı Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ZORLA: ${{ github.event.client_payload.zorla || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$ZORLA" = "true" ]; then
            python scripts/hatirlat.py --zorla
          else
            python scripts/hatirlat.py
          fi

      - name: Veritabanını Kaydet
        if: always()
        run: |
          python scripts/db_kaydet.py "db: hatirlatma ve zaman asimi durumlari guncellendi"

      - name: Hata bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          t, c = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not (t and c):
              raise SystemExit(0)
          url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          requests.post(f"https://api.telegram.org/bot{t}/sendMessage", timeout=20, json={
              "chat_id": c, "parse_mode": "HTML",
              "text": f"🔴 <b>{'Onay Hatırlatıcı'} BAŞARISIZ</b>\n\n"
                      f'<a href="{url}">Log</a>',
          })
          PY
