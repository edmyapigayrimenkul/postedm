name = "edm-telegram-dispatcher"
main = "index.js"
compatibility_date = "2026-09-08"

# Değişkenler Cloudflare Dashboard'dan veya 'wrangler secret put' ile verilir:
# TELEGRAM_BOT_TOKEN
# GITHUB_TOKEN
# GITHUB_REPOSITORY

[vars]
GITHUB_REPOSITORY = "edmyapigayrimenkul/postedm"

[triggers]
# Her sabah 06:00 UTC = 09:00 TR saati (Tam vaktinde GitHub Actions'ı uyandırır)
crons = ["0 6 * * *"]
