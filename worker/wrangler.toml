name = "edm-telegram-dispatcher"
main = "index.js"
compatibility_date = "2026-09-08"
workers_dev = true

# Gizli değerler 'wrangler secret put' ile veya Cloudflare API'siyle verilir:
#   TELEGRAM_BOT_TOKEN   — answerCallbackQuery ve mesaj düzenleme için
#   GITHUB_TOKEN         — repository_dispatch tetiklemek için (repo yetkisi)
#   WEBHOOK_SECRET       — Telegram'ın X-Telegram-Bot-Api-Secret-Token başlığı
#   IZINLI_SOHBETLER     — komut verebilecek sohbet kimlikleri, virgülle (grup kimliği
#                          eksi işaretli). İlki bildirim sohbeti. BOŞSA HİÇBİR KOMUT
#                          ÇALIŞMAZ. secret_token isteğin Telegram'dan geldiğini
#                          kanıtlar, kimin yazdığını değil; bu liste olmadan bota
#                          özelden yazan herkes /finans, /sil tetikleyebiliyordu.
#
# ⚠️ WEBHOOK_SECRET olmadan Worker HER isteği reddeder (fail-closed).
#    Telegram tarafı setWebhook'a secret_token ile aynı değerle kurulmalı:
#      curl -F "url=https://<worker>.workers.dev" \
#           -F "secret_token=<ayni-deger>" \
#           https://api.telegram.org/bot<TOKEN>/setWebhook
#
# Dağıtıldığı adres: https://edm-telegram-dispatcher.ezanplus.workers.dev
# (11 Eyl 2026'da kuruldu; öncesinde Worker HİÇ dağıtılmamıştı ve
#  Telegram webhook'u boştu — onay butonları hiçbir şey yapmıyordu.)

# Custom domain kaldırıldı — edmyapigayrimenkul.com ana siteye aittir (edm-yapi-gayrimenkul).
# Bu Worker yalnızca edm-telegram-dispatcher.ezanplus.workers.dev üzerinde çalışır.

[vars]
GITHUB_REPOSITORY = "edmyapigayrimenkul/postedm"

# [triggers] — PLANLI YAYIN ÇALAR SAATİ + ZAMANLANMIŞ İŞLER (2026-10-12, genişletildi 2026-10-13)
#
# • "*/10 * * * *": "30 dk / 1-4 saat sonra yayınla" seçilince Worker planı PLANLAR KV'sine yazar; bu cron
#   10 dakikada bir vakti gelen planı "yayinla" olarak GitHub'a yollar (GitHub yalnızca gerçek iş varken uyanır).
# • Diğer yedi cron ZAMANLANMIŞ İŞLERDİR (index.js › ZAMANLI_ISLER). GitHub `schedule` koşuları 6-10 saat gecikiyordu
#   (07:00 UTC içeriği 16:37'de, 09:30 sözlüğü 19:13'te çalıştı); Cloudflare cron'u dakikasında çalışır. scheduled() her biri için
#   `repository_dispatch` {slot, zamanli: true} yollar:
#     "40 5 * * *"   08:40 TR  günlük rapor            → rapor
#     "17 6 * * *"   09:17 TR  haber önerisi (sabah)   → haber_oneri
#     "0 7 * * *"    10:00 TR  günlük bilgilendirici   → slot_hazirla
#     "30 9 * * *"   12:30 TR  günlük sözlük kartı     → slot_hazirla
#     "30 10 * * *"  13:30 TR  onay hatırlatıcı (öğle) → hatirlat
#     "17 15 * * *"  18:17 TR  haber önerisi (akşam)   → haber_oneri
#     "30 18 * * *"  21:30 TR  onay hatırlatıcı (akşam)→ hatirlat
#
# GÜNDE İKİ KEZ OLMASIN (tests/test_sozlesme.py › test_tek_tetikleyici_kurali, tests/test_zamanli_isler.py): ilgili workflow'lardaki
# aynı saatli GitHub cron'ları SİLİNMEDİ, gecikmeli YEDEK olarak duruyor; aynı slot aynı Türkiye gününde ikinci kez çalışmaz
# (hazirla.py / scripts/zamanli_koruma.py › ayarlar › zamanli_slot_son_gun:<slot>). Cloudflare cron'u hiç yazılmamışsa
# (aşağıya bakın) GitHub yedeği işi geç de olsa çalıştırır; Worker dağıtılmadan GitHub cron'u kaldırılırsa İŞ HİÇ ÇALIŞMAZ.
#
# ⚠️ Dağıtımdan sonra cron'ların gerçekten yazıldığını doğrula (Cloudflare panel › Workers › edm-telegram-dispatcher ›
# Settings › Triggers › Cron Triggers'ta SEKİZ satır görünmeli): sınıra takılan dağıtım kodu yükleyip cron'u
# sessizce yazmıyordu (Instabot, 5 Eyl 2026). Hesap Workers Paid planında (kullanıcı, 2026-09-26): ücretsiz plandaki
# "hesap başına 5 cron" sınırı yok. Worker Dağıt workflow'u sekizini de Cloudflare API'sinden doğrular.
[triggers]
crons = [
  "*/10 * * * *",
  "40 5 * * *", "17 6 * * *", "0 7 * * *", "30 9 * * *",
  "30 10 * * *", "17 15 * * *", "30 18 * * *",
]

# Planlar: anahtar plan:<telegram mesaj id>, değer JSON {an, payload, secili, ...}.
# Instabot'un PLANLAR KV'sinden AYRI (o başka bir botun).
[[kv_namespaces]]
binding = "PLANLAR"
id = "526f2913066e47c1be628e3daeda98b9"
