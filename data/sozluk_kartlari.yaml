  puf:
  - Korkutma sonucu sözleşme yapan taraf sözleşmeyle bağlı değildir.
  - Kişilik haklarına veya malvarlığına yönelik ağır ve yakın tehlike inancı haklıysa korkutma gerçekleşmiş sayılır.
