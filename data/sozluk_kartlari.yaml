  puf:
  - Taşınmazlarda paylı mülkiyetin devamına ilişkin sözleşmeler resmî şekle bağlıdır ve tapuya şerh verilebilir.
  - Paylaşmayı isteme hakkı en çok on yıl sınırlandırılabilir; uygun olmayan zamanda paylaşma isteminde bulunulamaz.
