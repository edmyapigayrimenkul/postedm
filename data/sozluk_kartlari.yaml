  dayanak_alintisi: İmzanın, borç altına girenin el yazısıyla atılması zorunludur.
  kontrol: '2026-10-15'
- kod: SZ-074
  terim: İRADİ ŞEKİL
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Kanunen şekle tabi olmayan bir sözleşmenin geçerliliğinin, tarafların kendi anlaşmalarıyla belirli bir şekle bağlanmasıdır.
  puf:
  - Taraflarca belirlenen geçerlilik şekline uyulmadan yapılan sözleşme tarafları bağlamaz.
  - Ayrıntı belirtilmeksizin yazılı şekil kararlaştırılmışsa yasal yazılı şekil kuralları uygulanır.
