  puf:
  - Bağımsız ve sürekli hakların taşınmaz mülkiyetine konu olabilmesi için tapuda ayrı sayfaya kaydı zorunludur.
  - Kat mülkiyeti kütüğüne kayıtlı bağımsız bölümler de müstakil birer taşınmaz mülkiyeti konusu oluşturur.
  mevzuat: 4721 sayılı Kanun md. 704
  dayanak_alintisi: 'Taşınmaz mülkiyetinin konusu şunlardır: 1. Arazi, 2. Tapu kütüğünde ayrı sayfaya kaydedilen bağımsız ve sürekli haklar, 3. Kat mülkiyeti kütüğüne kayıtlı bağımsız bölümler.'
  kontrol: '2026-10-18'
- kod: SZ-091
  terim: TESCİL İLKESİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Taşınmaz mülkiyetinin kazanılmasının kural olarak tapu kütüğüne tescil yapılmasıyla gerçekleşeceğini öngören temel ilkedir.
  puf:
  - Miras, mahkeme kararı, cebrî icra, işgal ve kamulaştırma hâllerinde mülkiyet tescilden önce kazanılır.
  - Tescilsiz kazanılan hâllerde de malikin tasarruf işlemi yapabilmesi tapu kütüğüne tescil edilmiş olmasına bağlıdır.
  mevzuat: 4721 sayılı Kanun md. 705
  dayanak_alintisi: Taşınmaz mülkiyetinin kazanılması, tescille olur.
  kontrol: '2026-10-18'
- kod: SZ-092
  terim: RESMÎ ŞEKİL ŞARTI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Taşınmaz mülkiyetinin devrini amaçlayan sözleşmelerin geçerli olabilmesi için kanunen resmî şekilde düzenlenmesi zorunluluğudur.
  puf:
  - Taşınmaz mülkiyetinin devrini amaçlayan sözleşmeler resmî şekilde düzenlenmiş bulunmadıkça geçerli olmaz.
  - Ölüme bağlı tasarruflar ve mal rejimi sözleşmeleri, genel resmî şekilden ayrı kendilerine özgü şekillere tabidir.
  mevzuat: 4721 sayılı Kanun md. 706
  dayanak_alintisi: Taşınmaz mülkiyetinin devrini amaçlayan sözleşmelerin geçerli olması, resmî şekilde düzenlenmiş bulunmalarına bağlıdır.
  kontrol: '2026-10-18'
- kod: SZ-093
  terim: HEYELAN BÖLGESİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Yetkili makamlarca belirlenen ve arazi kaymasının sınır değişikliğine yol açmayacağı kuralının uygulanmadığı yörelerdeki arazidir.
  puf:
  - Heyelan bölgeleri yetkili makamlarca belirlenirken ilgili yöredeki arazinin yapısı doğrudan göz önünde tutulur.
  - Taşınmazın heyelan bölgesinde bulunduğu ilgililere bildirilir ve tapu kütüğünün beyanlar sütununa resmen yazılır.
  mevzuat: 4721 sayılı Kanun md. 710
  dayanak_alintisi: Arazi kaymasının sınır değişikliğine yol açmayacağı ilkesi, yetkili makamlarca heyelân bölgesi olduğu belirlenen yörelerde uygulanmaz.
  kontrol: '2026-10-18'
- kod: SZ-094
  terim: OLAĞAN ZAMANAŞIMI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Geçerli hukuki sebep olmaksızın tapuda malik yazılan kişinin, davasız, aralıksız ve 10 yıl iyiniyetli zilyetlikle mülkiyet kazanmasıdır.
  puf:
  - Taşınmaz üzerindeki zilyetliğin davasız ve aralıksız olarak tam on yıl boyunca iyiniyetle sürdürülmesi zorunludur.
  - Bu şartlar gerçekleştiğinde, kişinin bu yolla kazanmış olduğu taşınmaz mülkiyeti hakkına artık itiraz edilemez.
  mevzuat: 4721 sayılı Kanun md. 712
  dayanak_alintisi: Geçerli bir hukukî sebep olmaksızın tapu kütüğüne malik olarak yazılan kişi, taşınmaz üzerindeki zilyetliğini davasız ve aralıksız olarak on yıl süreyle ve iyiniyetle sürdürürse, onun bu yolla kazanmış olduğu mülkiyet hakkına itiraz edilemez.
  kontrol: '2026-10-18'
- kod: SZ-095
  terim: DİKEY KAPSAM
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Arazi üzerindeki mülkiyetin, kullanılmasında yarar olduğu ölçüde arazinin üstündeki hava ve altındaki arz katmanlarını kapsamasıdır.
  puf:
  - Mülkiyet hakkı, arazinin üstündeki ve altındaki alanı ancak malikin kullanılmasında yarar olduğu ölçüde kapsar.
  - Bu mülkiyetin kapsamına, yasal sınırlamalar saklı kalmak üzere yapılar, bitkiler ve kaynaklar da doğrudan girer.
  mevzuat: 4721 sayılı Kanun md. 718
  dayanak_alintisi: Arazi üzerindeki mülkiyet, kullanılmasında yarar olduğu ölçüde, üstündeki hava ve altındaki arz katmanlarını kapsar.
  kontrol: '2026-10-18'
- kod: SZ-096
  terim: HAKSIZ YAPI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Kendi arazisindeki yapıda başkasının malzemesini ya da başkasının arazisindeki yapıda malzemenin rızasız kullanılması durumudur.
  puf:
  - Rızasız kullanılan malzeme, sökülüp kaldırılıncaya kadar yapının ve arazinin bütünleyici parçası niteliğini alır.
  - Söküm aşırı zarara yol açmayacaksa, malzeme veya arazi sahibi masrafı yaptırana ait olmak üzere sökme isteyebilir.
  mevzuat: 4721 sayılı Kanun md. 722
  dayanak_alintisi: Bir kimse kendi arazisindeki yapıda başkasının malzemesini ya da başkasının arazisindeki yapıda kendisinin veya bir başkasının malzemesini kullanırsa, bu malzeme arazinin bütünleyici parçası olur.
  kontrol: '2026-10-18'
- kod: SZ-097
  terim: ARAZİ DEVRİ İSTEMİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Yapının değeri arazi değerinden açıkça fazlaysa, iyiniyetli tarafın uygun bedelle arsa mülkiyetinin devrini isteme yetkisidir.
  puf:
  - İyiniyetli olmak koşuluyla devir isteme hakkını hem yapıyı yapan malzeme sahibi hem de arazi maliki kullanabilir.
  - Devir uygun bir bedel karşılığında; arazinin tamamının veya yapı için yeterli kısmının mülkiyeti verilerek yapılır.
  mevzuat: 4721 sayılı Kanun md. 724
  dayanak_alintisi: Yapının değeri açıkça arazinin değerinden fazlaysa, iyiniyetli taraf uygun bir bedel karşılığında yapının ve arazinin tamamının veya yeterli bir kısmının mülkiyetinin malzeme sahibine verilmesini isteyebilir.
  kontrol: '2026-10-18'
- kod: SZ-098
  terim: TAŞKIN YAPI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Bir taşınmaz üzerinde inşa edilen yapının, bitişikteki komşu taşınmazın sınırını ve alanını aşarak inşa edilmesidir.
  puf:
  - Taşırılan arazi üzerinde geçerli bir irtifak hakkı varsa, taşan kısım yapıyı yapanın taşınmazının parçası olur.
  - Komşu 15 günde itiraz etmezse; iyiniyetli yapan, uygun bedelle irtifak veya mülkiyet devri talep edebilir.
  mevzuat: 4721 sayılı Kanun md. 725
  dayanak_alintisi: Bir yapının başkasına ait araziye taşırılan kısmı, eğer yapıyı yapan malik taşırılan arazi üzerinde bir irtifak hakkına sahip bulunuyorsa, ona ait taşınmazın bütünleyici parçası olur.
  kontrol: '2026-10-18'
- kod: SZ-099
  terim: TAŞINIR YAPI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Başkasının arazisi üzerinde kalıcı olması amaçlanmaksızın kurulan kulübe, büfe, çardak ve baraka gibi hafif yapılardır.
  puf:
  - Kalıcı olması amaçlanmayan hafif yapılar arazinin parçası sayılmaz; doğrudan bunları yapan malikine aittir.
  - Bu tür yapılar taşınır mal hükümlerine tabi olur ve tapu kütüğüne tescil edilmez veya gösterilmez.
  mevzuat: 4721 sayılı Kanun md. 728
  dayanak_alintisi: Başkasının arazisi üzerinde kalıcı olması amaçlanmaksızın yapılan kulübe, büfe, çardak, baraka ve benzeri hafif yapılar, bunların malikine aittir.
  kontrol: '2026-10-18'
- kod: SZ-100
  terim: KOMŞU HAKKI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Taşınmaz malikinin mülkünü kullanırken veya işletirken komşularını olumsuz etkileyecek taşkınlıklardan kaçınma borcudur.
  puf:
  - Yerel âdete göre hoş görülebilecek dereceyi aşan duman, buğu, kurum, toz, koku, gürültü veya sarsıntı yasaktır.
  - Yerel âdete uygun ve kaçınılmaz taşkınlıklardan doğan denkleştirme (tazminat) hakları saklıdır.
  mevzuat: 4721 sayılı Kanun md. 737
  dayanak_alintisi: Herkes, taşınmaz mülkiyetinden doğan yetkileri kullanırken ve özellikle işletme faaliyetini sürdürürken, komşularını olumsuz şekilde etkileyecek taşkınlıktan kaçınmakla yükümlüdür.
  kontrol: '2026-10-18'
- kod: SZ-101
  terim: TAŞAN DAL VE KÖKLER
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Komşu parselden araziye taşarak zarar veren ağaç dalı veya köklerinin kaldırılmasını isteme ve sahiplenme yetkisidir.
  puf:
  - Zarar veren dal ve kökler isteme rağmen uygun sürede kaldırılmazsa, komşu bunları kesip mülkiyetine geçirebilir.
  - Taşmaya katlanan komşu bu dallardaki meyveleri toplayabilir; ancak komşu ormanlar hakkında bu kural uygulanmaz.
  mevzuat: 4721 sayılı Kanun md. 740
  dayanak_alintisi: Komşunun arazisine taşarak zarar veren dal ve kökler, onun istemi üzerine uygun bir süre içinde kaldırılmazsa, komşu bu dal ve kökleri kesip kendi mülkiyetine geçirebilir.
  kontrol: '2026-10-18'
- kod: SZ-102
  terim: MECRA HAKKI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Zorunlu hatların araziden geçirilmesine katlanma ve bu hakkı tapu kütüğüne irtifak olarak tescil ettirme yetkisidir.
  puf:
  - Arazisinden hat geçirilen malikin uğrayacağı zararın tamamının önceden ve tam olarak ödenmesi şarttır.
  - Hak sahibinin istemi ve giderleri ödemesiyle tescil edilir; kamulaştırmaya tabi mecralara bu kural uygulanmaz.
  mevzuat: 4721 sayılı Kanun md. 744
  dayanak_alintisi: Mecrayı geçirme hakkı, hak sahibinin istemi üzerine ve giderleri ödemesi koşuluyla tapu kütüğüne tescil edilir.
  kontrol: '2026-10-18'
- kod: SZ-103
  terim: ZORUNLU SU HAKKI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Gerekli sudan yoksun olan taşınmaz malikinin, bedeli karşılığında komşusunun fazla suyundan irtifakla yararlanma hakkıdır.
  puf:
  - Zorunlu su irtifakının kurulmasında öncelikle kaynak sahibinin menfaati ve ihtiyacı gözetilir.
  - Durum ve koşullar değiştiğinde kurulmuş su irtifakının değiştirilmesi veya kaldırılması istenebilir.
  mevzuat: 4721 sayılı Kanun md. 761
  dayanak_alintisi: Evi, arazisi veya işletmesi için gerekli sudan yoksun olup, bunu aşırı zahmet ve gidere katlanmaksızın başka yoldan sağlayamayan taşınmaz maliki, komşusundan, onun ihtiyacından fazla olan suyu tam bir bedel karşılığında almasını sağlayacak bir irtifak kurulmasını isteyebilir.
  kontrol: '2026-10-18'
- kod: SZ-104
  terim: İRTİFAK HAKKI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Bir taşınmaz üzerinde diğer bir taşınmaz lehine kurulan, malikini mülkiyet yetkilerinden kaçınmaya veya belirli kullanıma katlanmaya mecbur kılan sınırlı ayni haktır.
  puf:
  - Yapma borçları, irtifaka başlı başına konu olamaz; ona ancak yan edim olarak bağlanabilir.
  - İrtifak yükü, maliki bazı yetkileri kullanmaktan kaçınmaya veya kullanıma katlanmaya mecbur kılar.
  mevzuat: Türk Medeni Kanunu md. 779
  dayanak_alintisi: Taşınmaz lehine irtifak hakkı, bir taşınmaz üzerinde diğer bir taşınmaz lehine konulmuş bir yük olup, yüklü taşınmazın malikini mülkiyet hakkının sağladığı bazı yetkileri kullanmaktan kaçınmaya veya yararlanan taşınmaz malikinin yüklü taşınmazı belirli şekilde kullanmasına katlanmaya mecbur kılar.
  kontrol: '2026-10-18'
- kod: SZ-105
  terim: İRTİFAKIN TESCİLİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: İrtifak hakkının hukuken kurulabilmesi ve geçerlilik kazanabilmesi için tapu kütüğüne tescil edilmesi zorunluluğudur.
  puf:
  - Kazanılmasında ve tescilinde, aksi öngörülmedikçe taşınmaz mülkiyeti hükümleri uygulanır.
  - İrtifakın zamanaşımıyla kazanılması ancak mülkiyeti bu yolla elde edilebilecek taşınmazlarda mümkündür.
  mevzuat: Türk Medeni Kanunu md. 780
  dayanak_alintisi: İrtifak hakkının kurulması için tapu kütüğüne tescil şarttır. İrtifak hakkının kazanılmasında ve tescilinde, aksi öngörülmüş olmadıkça taşınmaz mülkiyetine ilişkin hükümler uygulanır.
  kontrol: '2026-10-18'
- kod: SZ-106
  terim: İRTİFAKIN SONA ERMESİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: İrtifak hakkının tapu kütüğündeki tescilin terkini veya yüklü ya da yararlanan taşınmazın yok olmasıyla sona ermesidir.
  puf:
  - İki taşınmaza aynı kişi malik olsa bile terkin edilmedikçe irtifak hakkı ayni hak olarak varlığını sürdürür.
  - Lehine kurulan taşınmaz için hiçbir yararı kalmamışsa yüklü taşınmaz maliki hakkın terkinini isteyebilir.
  mevzuat: Türk Medeni Kanunu md. 783, 784 ve 785
  dayanak_alintisi: İrtifak hakkı, tescilin terkini veya yüklü ya da yararlanan taşınmazın yok olmasıyla sona erer.
  kontrol: '2026-10-18'
- kod: SZ-107
  terim: İNTİFADA BAKIM
  kategori_kodu: TAPU_VE_HUKUK
  tanim: İntifa hakkı sahibinin, hakkın konusu olan malın korunması ve olağan bakımı için onarım ve yenilemeleri yapma borcudur.
  puf:
  - Daha önemli iş ve önlemler gerekiyorsa intifa sahibi durumu malike bildirmek ve izin vermek zorundadır.
  - Malik gereken işleri yapmaktan kaçınırsa intifa hakkı sahibi bunları onun hesabına kendisi yapabilir.
  mevzuat: Türk Medeni Kanunu md. 812
  dayanak_alintisi: İntifa hakkı sahibi, hakkın konusu olan malın muhafazası ve olağan bakımı için gerekli onarım ve yenilemeleri yapmakla yükümlüdür.
  kontrol: '2026-10-18'
- kod: SZ-108
  terim: OTURMA HAKKI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Hak sahibine bir binadan veya onun bir bölümünden konut olarak yararlanma yetkisi veren şahsa bağlı irtifak hakkıdır.
  puf:
  - Oturma hakkı başkasına devredilemez ve mirasçılara geçmez.
  - Kanunda aksine hüküm bulunmadıkça intifa hakkına ilişkin hükümler oturma hakkına da uygulanır.
  mevzuat: Türk Medeni Kanunu md. 823
  dayanak_alintisi: Oturma hakkı, bir binadan veya onun bir bölümünden konut olarak yararlanma yetkisi verir. Oturma hakkı, başkasına devredilemez ve mirasçılara geçmez.
  kontrol: '2026-10-18'
- kod: SZ-109
  terim: OTURMA KAPSAMI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Oturma hakkı sahibinin binadan yararlanma sınırlarının genel olarak kişisel ihtiyaçlarına göre belirlendiği yasal kapsamdır.
  puf:
  - Açıkça şahsına özgülendiği belirtilmedikçe hak sahibi binada ailesi ve ev halkı ile birlikte oturabilir.
  - Binanın bir bölümünde oturma hakkına sahip olan kimse ortaklaşa kullanıma özgülenen yerlerden de yararlanabilir.
  mevzuat: Türk Medeni Kanunu md. 824
  dayanak_alintisi: Oturma hakkının kapsamı, genel olarak hak sahibinin kişisel ihtiyaçlarına göre belirlenir. Oturma hakkı sahibi, hakkın şahsına özgülendiği açıkça belirtilmedikçe, bina veya onun bir bölümünde ailesi ve ev halkı ile birlikte oturabilir.
  kontrol: '2026-10-18'
- kod: SZ-110
  terim: ÜST HAKKI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Taşınmaz malikinin üçüncü kişi lehine arazisinin altında veya üstünde yapı yapma ya da koruma yetkisi tanıdığı irtifak hakkıdır.
  puf:
  - Aksi kararlaştırılmış olmadıkça üst hakkı devredilebilir ve mirasçılara geçer.
  - Bağımsız ve en az 30 yıl süreli üst hakkı süreklidir; sahibinin istemiyle tapuya taşınmaz olarak kaydedilebilir.
  mevzuat: Türk Medeni Kanunu md. 826
  dayanak_alintisi: Bir taşınmaz maliki, üçüncü kişi lehine arazisinin altında veya üstünde yapı yapmak veya mevcut bir yapıyı muhafaza etmek yetkisi veren bir irtifak hakkı kurabilir. Aksi kararlaştırılmış olmadıkça bu hak, devredilebilir ve mirasçılara geçer.
  kontrol: '2026-10-18'
- kod: SZ-111
  terim: ÜST HAKKI SÜRESİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Bağımsız bir üst hakkının en çok yüz yıl için kurulabileceğini ve süre uzatım şartlarını belirleyen azami sınırdır.
  puf:
  - Sürenin 3/4'ü dolduktan sonra resmî şekle uyularak her zaman en çok 100 yıllık yeni bir süre için uzatılabilir.
  - Üst hakkı süresinin uzatılacağına ilişkin önceden yapılan taahhütler kanunen bağlayıcı değildir.
  mevzuat: Türk Medeni Kanunu md. 836
  dayanak_alintisi: Üst hakkı, bağımsız bir hak olarak en çok yüz yıl için kurulabilir. Üst hakkı, süresinin dörtte üçü dolduktan sonra, kurulması için öngörülen şekle uyularak her zaman en çok yüz yıllık yeni bir süre için uzatılabilir.
  kontrol: '2026-10-18'
- kod: SZ-112
  terim: TAŞINMAZ YÜKÜ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Bir taşınmaz malikini yalnızca o taşınmazla sorumlu olmak üzere bir başkasına bir şey vermek veya yapmakla yükümlü kılan ayni haktır.
  puf:
  - Hak sahibi olarak doğrudan bir başka taşınmazın maliki de gösterilebilir.
  - Konusu ancak yüklü taşınmazın ekonomik niteliğinden doğan veya yararlananın ekonomik ihtiyacını karşılayan edimdir.
  mevzuat: Türk Medeni Kanunu md. 839
  dayanak_alintisi: Taşınmaz yükü, bir taşınmazın malikini yalnız o taşınmazla sorumlu olmak üzere diğer bir kimseye bir şey vermek veya yapmakla yükümlü kılar.
  kontrol: '2026-10-18'
- kod: SZ-113
  terim: TAŞINMAZ REHNİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Bir alacağı teminat altına almak amacıyla taşınmaz üzerinde kanunda sayılı şekillerde kurulan sınırlı ayni haktır.
  puf:
  - Taşınmaz rehni ancak ipotek, ipotekli borç senedi veya irat senedi şeklinde kurulabilir; başka tür kurulamaz.
  - Taşınmaz rehni ancak tapuya kayıtlı taşınmazlar üzerinde kurulabilir; tapusuz taşınmazda rehin kurulamaz.
  mevzuat: Türk Medeni Kanunu md. 850 ve 853
  dayanak_alintisi: Taşınmaz rehni, ancak ipotek, ipotekli borç senedi veya irat senedi şeklinde kurulabilir.
  kontrol: '2026-10-18'
- kod: SZ-114
  terim: REHİNDE ÜST SINIR
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Taşınmaz rehninin, alacak miktarı belirsiz veya değişken ise bütün istemleri karşılayacak üst sınırla kurulması kuralıdır.
  puf:
  - Alacağın miktarı belli değilse taşınmazın güvence altına alacağı üst sınır taraflarca tescilde belirtilir.
  - Kredi kuruluşlarının yabancı para kredilerini güvenceye almak için yabancı para üzerinden de rehin kurulabilir.
  mevzuat: Türk Medeni Kanunu md. 851
  dayanak_alintisi: Taşınmaz rehni, miktarı Türk parası ile gösterilen belli bir alacak için kurulabilir. Alacağın miktarının belli olmaması hâlinde, alacaklının bütün istemlerini karşılayacak şekilde taşınmazın güvence altına alacağı üst sınır taraflarca belirtilir.
  kontrol: '2026-10-18'
- kod: SZ-115
  terim: REHNİN RESMÎ ŞEKLİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Taşınmaz rehni sözleşmesinin geçerliliğinin resmî memur önünde düzenlenmesine ve tapuya tescile bağlı olması kuralıdır.
  puf:
  - Taşınmaz rehninin kurulmasına ilişkin sözleşmenin geçerliliği resmî şekilde yapılmış olmasına bağlıdır.
  - Kanunda öngörülen ayrık durumlar (kanuni ipotekler) saklı kalmak üzere rehin tapu kütüğüne tescil ile kurulur.
  mevzuat: Türk Medeni Kanunu md. 856
  dayanak_alintisi: Taşınmaz rehni tapu kütüğüne tescil ile kurulur. Kanunda öngörülen ayrık durumlar saklıdır. Taşınmaz rehninin kurulmasına ilişkin sözleşmenin geçerliliği, resmî şekilde yapılmış olmasına bağlıdır.
  kontrol: '2026-10-18'
- kod: SZ-116
  terim: İPOTEK
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Mevcut veya henüz doğmamış olmakla beraber doğması olası bir alacağı güvence altına alan taşınmaz rehni türüdür.
  puf:
  - İpoteğe konu olacak taşınmazın borçlunun mülkiyetinde bulunması kanunen gerekmez.
  - Alacak sona erince ipotekli taşınmazın maliki alacaklıdan ipoteğin tapuda terkin edilmesini isteyebilir.
  mevzuat: Türk Medeni Kanunu md. 881 ve 883
  dayanak_alintisi: Hâlen mevcut olan veya henüz doğmamış olmakla beraber doğması kesin veya olası bulunan herhangi bir alacak, ipotekle güvence altına alınabilir. İpoteğe konu olacak taşınmazın, borçlunun mülkiyetinde bulunması gerekmez.
  kontrol: '2026-10-18'
- kod: SZ-117
  terim: İPOTEKLİ YERİN DEVRİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: İpotekli taşınmazın devredilmesi halinde asıl borçlunun sorumluluğunu ve rehin güvencesini düzenleyen temel kuraldır.
  puf:
  - Aksi kararlaştırılmış olmadıkça taşınmazın devri borçlunun sorumluluğunda ve güvencede değişiklik yaratmaz.
  - Yeni malik borcu yüklenir, alacaklı 1 yılda önceki borçluya yazılı bildirim yapmazsa borçlu borcundan kurtulur.
  mevzuat: Türk Medeni Kanunu md. 888
  dayanak_alintisi: İpotekli taşınmazın devri, aksi kararlaştırılmış olmadıkça, borçlunun sorumluluğunda ve güvencede bir değişiklik meydana getirmez. Yeni malik borcu yüklendiği takdirde alacaklı, kendisine başvurma hakkını saklı tuttuğunu bir yıl içinde yazılı olarak önceki borçluya bildirmezse, borçlu borcundan kurtulur.
  kontrol: '2026-10-18'
- kod: SZ-118
  terim: REHİN DERECESİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Taşınmaz rehninde alacaklıların tatmin sırasını ve tescil edilen güvence sınırını belirleyen resmi öncelik basamağıdır.
  puf:
  - Rehnin sağladığı güvence ve öncelik hakkı, tapu tescilinde belirtilen rehin derecesi ile sınırlıdır.
  - Önceki derecenin miktarı tescilde gösterilmek kaydıyla ikinci veya daha sonraki derecede de rehin kurulabilir.
  mevzuat: Türk Medeni Kanunu md. 870
  dayanak_alintisi: Rehnin sağladığı güvence, tescilde belirtilen rehin derecesi ile sınırlıdır. Taşınmaz rehni, sırada kendisinden önce gelecek olanın miktarının tescilde belirtilmesi kaydıyla ikinci veya daha sonraki derecede de kurulabilir.
  kontrol: '2026-10-18'
- kod: SZ-119
  terim: BOŞ DERECE KURALI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Önceki sıradaki rehin terkin edilse bile sonraki alacaklının kendiliğinden boş dereceye ilerleyememesi ilkesidir.
  puf:
  - Terkin edilen rehin hakkı yerine malik tarafından serbestçe yeni bir rehin hakkı kurulabilir.
  - Boşalan dereceye geçme sözleşmesinin geçerliliği resmî şekle, ayni etki sağlaması ise tapuya şerhe bağlıdır.
  mevzuat: Türk Medeni Kanunu md. 871
  dayanak_alintisi: Aynı taşınmaz üzerinde farklı sıralarda kurulmuş bulunan rehin haklarından birinin terkin edilmiş olması, sonraki sırada yer alan rehinli alacaklıya boşalan dereceye geçme hakkı vermez. Terkin edilen rehin hakkı yerine yeni bir rehin hakkı kurulabilir.
  kontrol: '2026-10-18'
- kod: SZ-120
  terim: İPOTEKLİ BORÇ SENEDİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Taşınmaz rehniyle güvence altına alınmış kişisel bir alacak meydana getiren kıymetli evrak niteliğindeki rehin senedidir.
  puf:
  - İpotekli borç senedi yoluyla rehin kurulabilmesi için tapu idaresince taşınmaza resmen değer biçilir.
  - Tapu idaresince resmen biçilmiş değeri aşan miktar için ipotekli borç senedi yoluyla rehin kurulamaz.
  mevzuat: Türk Medeni Kanunu md. 898 ve 899
  dayanak_alintisi: İpotekli borç senedi, taşınmaz rehniyle güvence altına alınmış kişisel bir alacak meydana getirir.
  kontrol: '2026-10-18'
- kod: SZ-121
  terim: KAYNAK HAKKI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Başkasının arazisinde bulunan su kaynağından su alma ve bu suyu kendi arazisine akıtma yetkisi veren irtifak hakkıdır.
  puf:
  - Aksi kararlaştırılmış olmadıkça bu irtifak hakkı başkasına devredilebilir ve mirasçılara geçer.
  - Bağımsız nitelikte ve en az 30 yıl için kurulmuş ise tapu kütüğüne taşınmaz olarak kaydedilebilir.
  mevzuat: Türk Medeni Kanunu md. 837
  dayanak_alintisi: Başkasının arazisinde bulunan kaynak üzerinde irtifak hakkı, bu arazinin malikini suyun alınmasına ve akıtılmasına katlanmakla yükümlü kılar. Bu hak, aksi kararlaştırılmış olmadıkça, başkasına devredilebilir ve mirasçıya geçer.
  kontrol: '2026-10-18'
