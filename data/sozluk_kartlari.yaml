  puf:
  - Yanılma ve aldatmayı öğrenme, korkutmada ise tehlikenin bitiminden itibaren bir yıllık hak düşürücü süre vardır.
  - Bu bir yıl içinde bağlı olunmadığı bildirilmez veya verilen geri istenmezse sözleşme onanmış sayılır.
  - Sözleşmenin onanmış sayılması, aldatma veya korkutmadan doğan tazminat isteme hakkını ortadan kaldırmaz.
