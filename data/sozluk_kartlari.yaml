- kod: SZ-052
  terim: GERİ VERME İNCELEMESİ
  kategori_kodu: KIRA_VE_TAHLIYE
  tanim: Kiraya verenin, geri verme sırasında kiralananın durumunu gözden geçirip kiracının sorumlu olduğu eksiklik ve ayıpları ona hemen yazılı olarak bildirme zorunluluğudur.
  puf:
  - Bildirim yoksa kiracı, teslimde olağan incelemeyle belirlenemeyecek eksik ve ayıp dışında sorumluluktan kurtulur.
  - Kiraya veren, olağan incelemeyle belirlenemeyen eksik ve ayıpları belirleyince kiracıya hemen yazılı bildirmelidir.
  mevzuat: 6098 sayılı Kanun md. 335
  dayanak_alintisi: Kiraya veren, geri verme sırasında kiralananın durumunu gözden geçirmek ve kiracının sorumlu olduğu eksiklikleri ve ayıpları ona hemen yazılı olarak bildirmek zorundadır.
  kontrol: '2026-10-13'
- kod: SZ-053
  terim: KİRA UZAMASI
  kategori_kodu: KIRA_VE_TAHLIYE
  tanim: Konut ve çatılı işyeri kiralarında belirli süreli sözleşmenin, kiracı süre bitiminden en az on beş gün önce bildirimde bulunmadıkça aynı koşullarla bir yıl için uzatılmış sayılmasıdır.
  puf:
  - Kiraya veren, sözleşme süresinin bitimine dayanarak sözleşmeyi sona erdiremez.
  - Ancak on yıllık uzama süresi sonunda, her uzama yılı bitiminden en az üç ay önce bildirip sebepsiz son verebilir.
  - Fesih bildirimi, konut ve çatılı işyeri kiralarında ancak yazılı yapılırsa geçerlidir.
  mevzuat: 6098 sayılı Kanun md. 347 ve 348
  dayanak_alintisi: Konut ve çatılı işyeri kiralarında kiracı, belirli süreli sözleşmelerin süresinin bitiminden en az onbeş gün önce bildirimde bulunmadıkça, sözleşme aynı koşullarla bir yıl için uzatılmış sayılır.
  kontrol: '2026-10-13'
- kod: SZ-054
  terim: KULLANMA GİDERLERİ
  kategori_kodu: KIRA_VE_TAHLIYE
  tanim: Konut ve çatılı işyeri kiralarında ısıtma, aydınlatma ve su gibi giderleri kapsayan kanuni kavramdır.
  puf:
  - Sözleşmede aksi öngörülmemişse veya aksine yerel âdet yoksa kiracı bu giderlere katlanmakla yükümlüdür.
  - Giderlere katlanan taraf, ispat edici belgelerin birer örneğini istem üzerine diğer tarafa vermek zorundadır.
  mevzuat: 6098 sayılı Kanun md. 341
  dayanak_alintisi: Kiracı, konut ve çatılı işyeri kiralarında, sözleşmede aksi öngörülmemişse veya aksine yerel âdet yoksa, ısıtma, aydınlatma ve su gibi kullanma giderlerine katlanmakla yükümlüdür.
  kontrol: '2026-10-13'
- kod: SZ-055
  terim: AİLE KONUTU KİRASI
  kategori_kodu: KIRA_VE_TAHLIYE
  tanim: Aile konutu olarak kullanılmak üzere kiralanan taşınmazda kiracının, eşinin açık rızası olmadıkça kira sözleşmesini feshedememesi kuralıdır.
  puf:
  - Rızanın alınması mümkün değilse ya da eş haklı sebep olmadan rıza vermezse kiracı, hâkimden karar isteyebilir.
  - Eş, kiraya verene bildirimle taraf olursa fesih bildirimi ve ihtardaki ödeme süresi ikisine ayrı ayrı bildirilir.
  mevzuat: 6098 sayılı Kanun md. 349
  dayanak_alintisi: Aile konutu olarak kullanılmak üzere kiralanan taşınmazlarda kiracı, eşinin açık rızası olmadıkça kira sözleşmesini feshedemez.
  kontrol: '2026-10-13'
- kod: SZ-056
  terim: YENİDEN İNŞA TAHLİYESİ
  kategori_kodu: KIRA_VE_TAHLIYE
  tanim: Kiralananın yeniden inşası veya imarı amacıyla esaslı onarımı, genişletilmesi ya da değiştirilmesi gerekli ve bu işler sırasında kullanımı imkânsızsa, kiraya verenin sözleşmeyi dava ile sona erdirebilmesidir.
  puf:
  - Belirli süreli sözleşmede dava, sürenin sonundan başlayarak bir ay içinde açılmalıdır.
  - Kiraya veren bu sürede dava açacağını kiracıya yazılı bildirmişse, dava süresi bir kira yılı uzar.
  - Bu amaçla boşaltılan taşınmaz eski hâliyle, haklı sebep olmaksızın üç yıl geçmedikçe başkasına kiralanamaz.
  mevzuat: 6098 sayılı Kanun md. 350, 353 ve 355
  dayanak_alintisi: Yeniden inşa ve imar amacıyla boşaltılması sağlanan taşınmazlar, eski hâli ile, haklı sebep olmaksızın üç yıl geçmedikçe başkasına kiralanamaz.
  kontrol: '2026-10-13'
- kod: SZ-057
  terim: YENİ MALİKİN GEREKSİNİMİ
  kategori_kodu: KIRA_VE_TAHLIYE
  tanim: Kiralananı sonradan edinen kişinin, kendisi, eşi, altsoyu, üstsoyu veya kanun gereği bakmakla yükümlü olduğu kişiler için konut ya da işyeri gereksinimi sebebiyle kullanma zorunluluğu varsa sözleşmeyi dava ile sona erdirebilmesidir.
  puf:
  - Edinme tarihinden bir ay içinde durumu kiracıya yazılı bildirirse, altı ay sonra açacağı davayla sona erdirebilir.
  - Dilerse bu hakkı, sözleşme süresinin bitiminden başlayarak bir ay içinde açacağı davayla da kullanabilir.
  - Bu sürede dava açılacağı kiracıya yazılı bildirilmişse, dava süresi bir kira yılı uzar.
  mevzuat: 6098 sayılı Kanun md. 351 ve 353
  dayanak_alintisi: Kiralananı sonradan edinen kişi, onu kendisi, eşi, altsoyu, üstsoyu veya kanun gereği bakmakla yükümlü olduğu diğer kişiler için konut veya işyeri gereksinimi sebebiyle kullanma zorunluluğu varsa, edinme tarihinden başlayarak bir ay içinde durumu kiracıya yazılı olarak bildirmek koşuluyla, kira sözleşmesini altı ay sonra açacağı bir davayla sona erdirebilir.
  kontrol: '2026-10-13'
- kod: SZ-058
  terim: KONUTU OLAN KİRACI
  kategori_kodu: KIRA_VE_TAHLIYE
  tanim: Kendisinin veya birlikte yaşadığı eşinin aynı ilçe veya belde belediye sınırları içinde oturmaya elverişli bir konutu bulunan kiracıdır; kiraya veren bunu sözleşme kurulurken bilmiyorsa sözleşmeyi dava ile sona erdirebilir.
  puf:
  - Dava, sözleşmenin bitiminden başlayarak bir ay içinde açılmalıdır.
  - Kiraya veren bu sürede dava açacağını kiracıya yazılı bildirmişse, dava süresi bir kira yılı uzar.
  mevzuat: 6098 sayılı Kanun md. 352 ve 353
  dayanak_alintisi: Kiracının veya birlikte yaşadığı eşinin aynı ilçe veya belde belediye sınırları içinde oturmaya elverişli bir konutu bulunması durumunda kiraya veren, kira sözleşmesinin kurulması sırasında bunu bilmiyorsa, sözleşmenin bitiminden başlayarak bir ay içinde sözleşmeyi dava yoluyla sona erdirebilir.
  kontrol: '2026-10-13'
- kod: SZ-059
  terim: ESKİ KİRACI ÖNCELİĞİ
  kategori_kodu: KIRA_VE_TAHLIYE
  tanim: Yeniden inşa ve imarı gerçekleştirilen taşınmazı, eski kiracının yeni durumu ve yeni kira bedeliyle kiralamada sahip olduğu önceliktir.
  puf:
  - Hak, kiraya verenin yapacağı yazılı bildirimi izleyen bir ay içinde kullanılmalıdır.
  - Bu hak sona erdirilmedikçe taşınmaz, üç yıl geçmeden başkasına kiralanamaz.
  - Aykırılıkta kiraya veren, eski kiracıya son kira yılında ödenen bir yıllık kiradan az olmamak üzere tazminat öder.
  mevzuat: 6098 sayılı Kanun md. 355
  dayanak_alintisi: Eski kiracının, yeniden inşa ve imarı gerçekleştirilen taşınmazları, yeni durumu ve yeni kira bedeli ile kiralama konusunda öncelik hakkı vardır.
  kontrol: '2026-10-13'
- kod: SZ-060
  terim: ÜRÜN KİRASI
  kategori_kodu: KIRA_VE_TAHLIYE
  tanim: Kiraya verenin, kiracıya ürün veren bir şeyin veya hakkın kullanılmasını ve ürünlerin devşirilmesini (toplanmasını) bedel karşılığında bırakmayı üstlendiği sözleşmedir.
  puf:
  - Ürüne katılmalı kira, bedelin devşirilecek ürünün belli bir oranı olarak kararlaştırıldığı ürün kirasıdır.
  - Bu oran sözleşmeyle kararlaştırılmamışsa yerel âdete göre belirlenir.
  - Ürün kirasına ilişkin özel hüküm yoksa kira sözleşmesinin genel hükümleri uygulanır.
  mevzuat: 6098 sayılı Kanun md. 357 ve 358
  dayanak_alintisi: Ürün kirası kiraya verenin, kiracıya, ürün veren bir şeyin veya hakkın kullanılmasını ve ürünlerin devşirilmesini bedel karşılığında bırakmayı üstlendiği sözleşmedir.
  kontrol: '2026-10-13'
- kod: SZ-061
  terim: YETİŞME GİDERLERİ
  kategori_kodu: KIRA_VE_TAHLIYE
  tanim: Tarımsal bir taşınmazın kiracısının, kira sona erdiğinde henüz devşirilmemiş ürün için yaptığı tarım giderlerini kiraya verenden tazminat olarak isteyebilmesidir.
  puf:
  - Kiracı, kira sona erdiği anda henüz devşirilmemiş ürünler üzerinde bir hak ileri süremez.
  - İstenebilecek miktarı hâkim belirler; tazminat işlemiş kiralardan indirilir.
  mevzuat: 6098 sayılı Kanun md. 374
  dayanak_alintisi: Ancak kiracı, ürünün yetişmesi için yapmış olduğu tarım giderlerinin hâkim tarafından belirlenecek miktarını, kiraya verenden tazminat olarak isteyebilir ve bu tazminat işlemiş kiralardan indirilir.
  kontrol: '2026-10-13'
- kod: SZ-062
  terim: BAĞIMSIZ BÖLÜM
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Kat mülkiyetine konu gayrimenkulün, ayrı ayrı ve başlı başına kullanılmaya elverişli olup Kat Mülkiyeti Kanununa göre bağımsız mülkiyete konu olan bölümüdür.
  puf:
  - Kat mülkiyeti kütüğüne tescil edilen her bağımsız bölüm ayrı bir gayrimenkul niteliğini kazanır.
  - Kat maliki kendi bölümünde, bu Kanunun ilgili hükümleri saklı kalmak şartıyla, malikin tüm haklarına sahiptir.
  mevzuat: Kat Mülkiyeti Kanunu md. 1, 2, 13 ve 15
  dayanak_alintisi: Tamamlanmış bir yapının kat, daire, iş bürosu, dükkan, mağaza, mahzen, depo gibi bölümlerinden ayrı ayrı ve başlı başına kullanılmaya elverişli olanları üzerinde, o gayrimenkulün maliki veya ortak malikleri tarafından, bu Kanun hükümlerine göre, bağımsız mülkiyet hakları kurulabilir.
  kontrol: '2026-10-13'
- kod: SZ-063
  terim: EKLENTİ
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Bir bağımsız bölümün dışında olup doğrudan doğruya o bölüme tahsis edilmiş kömürlük, su deposu, garaj, tuvalet gibi yerdir.
  puf:
  - Eklenti, ait olduğu bağımsız bölümün bütünleyici parçasıdır; bölümün maliki eklentinin de tek başına maliki olur.
  - Eklentiler kat mülkiyeti kütüğünün beyanlar hanesine kaydedilir.
  - Bağımsız bölüm devredilir veya kiralanırsa eklentileri de kendiliğinden devredilmiş veya kiralanmış olur.
  mevzuat: Kat Mülkiyeti Kanunu md. 2 ve 6
  dayanak_alintisi: Bir bağımsız bölümün dışında olup, doğrudan doğruya o bölüme tahsis edilmiş olan kömürlük, su deposu, garaj, elektrik, havagazı veya su saati yuvaları, tuvalet gibi eklentiler, ait olduğu bağımsız bölümün bütünleyici parçası sayılır ve o bölümün maliki, eklentilerin de tek başına maliki olur.
  kontrol: '2026-10-13'
- kod: SZ-064
  terim: ORTAK YERLER
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Kat mülkiyetine konu gayrimenkulün bağımsız bölümleri dışında kalıp, korunma ve ortaklaşa kullanma veya faydalanmaya yarayan yerlerdir.
  puf:
  - Ortak yerler kat mülkiyeti kuruluş resmi senedinde belirtilebilir; kanunda sayılanlar her halde ortak yerdir.
  - Temeller, ana duvarlar, asansörler ve çatılar, kanunda her halde ortak yer sayılanlar arasındadır.
  - Kanunda sayılmasa da ortaklaşa kullanma, korunma veya faydalanma için zaruri olan yer ve şeyler de ortak yerdir.
  mevzuat: Kat Mülkiyeti Kanunu md. 2 ve 4
  dayanak_alintisi: Yukarıda sayılanların dışında kalıp da, yine ortaklaşa kullanma, korunma veya faydalanma için zaruri olan diğer yerler ve şeyler de (Ortak yer) konusuna girer.
  kontrol: '2026-10-13'
- kod: SZ-065
  terim: ARSA PAYI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Arsanın, Kat Mülkiyeti Kanununda yazılı esasa göre bağımsız bölümlere tahsis edilen ortak mülkiyet paylarıdır.
  puf:
  - Arsa payı, kat mülkiyeti veya kat irtifakından ayrı olarak ne devredilebilir ne de miras yoluyla geçebilir.
  - Anagayrimenkulde, kat mülkiyetine bağlanmamış veya lehine kat irtifakı kurulmamış arsa payı bırakılamaz.
  mevzuat: Kat Mülkiyeti Kanunu md. 2 ve 5
  dayanak_alintisi: Kat mülkiyetinin başkasına devri veya miras yoluyla geçmesi halinde, ona bağlı arsa payı da birlikte geçer; arsa payı, kat mülkiyetinden veya kat irtifakından ayrı olarak devredilemiyeceği gibi, miras yoluyla da geçmez ve başka bir hakla kayıtlanamaz.
  kontrol: '2026-10-13'
- kod: SZ-066
  terim: KULLANMA HAKKI
  kategori_kodu: TAPU_VE_HUKUK
  tanim: Kat maliklerinin, ortak malik sıfatıyla paydaşı oldukları ortak yerlerden faydalanma haklarıdır.
  puf:
  - Genel kömürlük, garaj, teras, çamaşırhane gibi yerlerde hakkın ölçüsü, aksine sözleşme yoksa arsa payı oranındadır.
  - Kat malikleri ortak yerlere arsa payları oranında, ortak mülkiyet hükümlerine göre malik olur.
  mevzuat: Kat Mülkiyeti Kanunu md. 2 ve 16
  dayanak_alintisi: Kat malikleri ortak yerlerde kullanma hakkına sahiptirler; bu hakkın genel kömürlük, garaj, teras, çamaşırhane ve çamaşır kurutma alanları gibi yerlerdeki ölçüsü, aksine sözleşme olmadıkça, her kat malikine ait arsa payı ile oranlıdır.
  kontrol: '2026-10-13'
