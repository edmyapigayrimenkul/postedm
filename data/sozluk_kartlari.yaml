- kod: SZ-034
  terim: YAPI KAYIT BELGESİ
  kategori_kodu: IMAR_VE_PARSEL
  tanim: 31/12/2017 tarihinden önce yapılmış ruhsatsız veya ruhsata aykırı yapıların kayıt altına alınması için verilen belgedir; imar barışı olarak bilinir.
  puf:
  - Belge yapının kullanım amacına yöneliktir.
  - Belge alan yapılara talep hâlinde geçici olarak su, elektrik ve doğalgaz bağlanabilir.
  - Başvuru süresi 31/10/2018 tarihinde sona ermiştir.
  mevzuat: İmar Kanunu geçici madde 16
  dayanak_alintisi: Afet risklerine hazırlık kapsamında ruhsatsız veya ruhsat ve eklerine aykırı yapıların kayıt altına alınması ve imar barışının sağlanması amacıyla, 31/12/2017 tarihinden önce yapılmış yapılar için Çevre ve Şehircilik Bakanlığı ve yetkilendireceği kurum ve kuruluşlara 31/10/2018 tarihine kadar başvurulması, bu maddedeki şartların yerine getirilmesi ve 31/12/2018 tarihine kadar kayıt bedelinin ödenmesi halinde Yapı Kayıt Belgesi verilebilir.
  kontrol: '2026-10-08'
