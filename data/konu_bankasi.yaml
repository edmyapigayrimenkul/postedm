  # ---------------------------------------------------------

  - kod: S1-024
    sutun: S1
    bicim: B1
    baslik: "Kanun değişti: önalımda üç yeni kural"
    aci: "7571 sayılı Kanunla (24/12/2025) önalım hakkında üç şey değişti. Üst süre kısaldı: hak, satışın bildirilmesinden itibaren üç ay ve her hâlde satıştan itibaren bir yıl geçince düşüyor. Payın bedelini artık tapudaki rakam değil hâkimin belirlediği rayiç değer belirliyor. Devlet İhale Kanunu kapsamındaki satışlarda ve cebrî artırmada önalım kullanılamıyor. Eski süreyi rakamla yazma; 'kısaldı' de."
    kanca_kalip: sure
    mevzuat: "Türk Medeni Kanunu md. 733, 734"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "8/9/1983 tarihli ve 2886 sayılı Devlet İhale Kanunu kapsamında yapılan satışlar ile cebrî artırmayla satışlarda önalım hakkı kullanılamaz."

  - kod: S1-025
    sutun: S1
    bicim: B3
    baslik: "Kentsel dönüşümde karar çoğunluğu"
    aci: "Riskli yapıda yeniden yapım kararı hisseleri oranında paydaşların salt çoğunluğuyla alınıyor; çok daha büyük çoğunluk gerektiği bilgisi eski. Karara katılmayanların arsa payı, rayiç değeri tespit ettirilerek ve bu değerden az olmamak üzere anlaşan diğer paydaşlara açık artırmayla satılabiliyor. Eski oranı yazma."
    kanca_kalip: yaygin_yanlis
    mevzuat: "6306 sayılı Kanun md. 6"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "yapının paydaşı olup olmadıkları gözetilmeksizin sahip oldukları hisseleri oranında paydaşların salt çoğunluğu ile karar verilir."

  - kod: S2-027
    sutun: S2
    bicim: B3
    baslik: "Tacir kiracının ayrıcalığı bitti"
    aci: "6217 sayılı Kanunun geçici 2. maddesi, kiracının tacir ya da tüzel kişi olduğu işyeri kiralarında Borçlar Kanununun bazı kira hükümlerini 1/7/2012'den itibaren 8 yıl süreyle uygulanmaz kılıyordu. Bu süre 1 Temmuz 2020'de doldu: güvence bedeli üç aylık kirayı aşamaz ve kira bedeli ile yan giderler dışında ödeme yükümlülüğü getirilemez kuralları artık tacir kiracılar için de geçerli."
    kanca_kalip: yaygin_yanlis
    mevzuat: "6217 sayılı Kanun geçici madde 2; Türk Borçlar Kanunu md. 342, 346"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiracının Türk Ticaret Kanununda tacir olarak sayılan kişiler ile özel hukuk ve kamu hukuku tüzel kişileri olduğu işyeri kiralarında, 11/1/2011 tarihli ve 6098 sayılı Türk Borçlar Kanununun 323, 325, 331, 340, 342, 343, 344, 346 ve 354 üncü maddeleri 1/7/2012 tarihinden itibaren 8 yıl süreyle uygulanmaz."

  # ---------------------------------------------------------
  # S2 — KİRACI & EV SAHİBİ  (paylaştırır)
  # ---------------------------------------------------------

  - kod: S2-001
    sutun: S2
    bicim: B1
    baslik: "Tahliye taahhütnamesinde boş tarih"
    aci: "Tarihi boş imzalanan taahhütname çoğu zaman geçerli sayılır. Ama kira sözleşmesiyle aynı gün imzalandığı ispatlanırsa Yargıtay irade fesadı sayıp hükümsüz kılabiliyor. İki taraf da bu ayrımı bilmiyor."
    kanca_kalip: eksik_imza
    mevzuat: "Türk Borçlar Kanunu md. 352/1"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiracı, kiralananın teslim edilmesinden sonra, kiraya verene karşı, kiralananı belli bir tarihte boşaltmayı yazılı olarak üstlendiği hâlde boşaltmamışsa kiraya veren, kira sözleşmesini bu tarihten başlayarak bir ay içinde icraya başvurmak veya dava açmak suretiyle sona erdirebilir."
    yerel: null

  - kod: S2-002
    sutun: S2
    bicim: B1
    baslik: "Kira artış tavanı nasıl hesaplanır"
    aci: "Konutta artış, bir önceki kira yılının TÜFE on iki aylık ortalamasını aşamaz. Yıllık TÜFE değil, on iki aylık ortalama — en sık yapılan hesap hatası bu."
    kanca_kalip: rakam
    mevzuat: "Türk Borçlar Kanunu md. 344"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Tarafların yenilenen kira dönemlerinde uygulanacak kira bedeline ilişkin anlaşmaları, bir önceki kira yılında tüketici fiyat endeksindeki oniki aylık ortalamalara göre değişim oranını geçmemek koşuluyla geçerlidir."
    yerel: null

  - kod: S2-002b
    sutun: S2
    bicim: B3
    baslik: "Ev sahibi tavanın üstünde zam isterse"
    aci: "Kiracı fazlasını ödemek zorunda değil ve eski kirayı yatırmaya devam ederse temerrüde düşmez. Ev sahibinin yolu kira tespit davası açmaktan geçer."
    kanca_kalip: kim_hakli
    mevzuat: "Türk Borçlar Kanunu md. 344"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Tarafların yenilenen kira dönemlerinde uygulanacak kira bedeline ilişkin anlaşmaları, bir önceki kira yılında tüketici fiyat endeksindeki oniki aylık ortalamalara göre değişim oranını geçmemek koşuluyla geçerlidir."
    yerel: null

  - kod: S2-003
    sutun: S2
    bicim: B1
    baslik: "On yılını dolduran kiracı"
    aci: "On yıllık uzama süresi dolduğunda ev sahibi sebep göstermeden, üç ay önceden bildirerek tahliye isteyebilir. Uzun süreli kiracıların çoğu kendini güvende sanıyor — tam tersi."
    kanca_kalip: sure
    mevzuat: "Türk Borçlar Kanunu md. 347"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Ancak, on yıllık uzama süresi sonunda kiraya veren, bu süreyi izleyen her uzama yılının bitiminden en az üç ay önce bildirimde bulunmak koşuluyla, herhangi bir sebep göstermeksizin sözleşmeye son verebilir."
    yerel: null

  - kod: S2-004
    sutun: S2
    bicim: B1
    baslik: "İhtiyaç nedeniyle tahliye"
    aci: "Ev sahibi kendisi veya bakmakla yükümlü olduğu yakını için tahliye isteyebilir; ama boşalttıktan sonra üç yıl başkasına kiralayamaz. Kiralarsa tazminat doğar."
    kanca_kalip: sure
    mevzuat: "Türk Borçlar Kanunu md. 350 ve 355"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiraya veren, gereksinim amacıyla kiralananın boşaltılmasını sağladığında, haklı sebep olmaksızın, kiralananı üç yıl geçmedikçe eski kiracısından başkasına kiralayamaz."
    yerel: null

  - kod: S2-005
    sutun: S2
    bicim: B1
    baslik: "İki haklı ihtar"
    aci: "Bir kira yılı içinde iki kez usulüne uygun ihtar çekilirse ev sahibi yıl sonunda tahliye davası açabilir. Kirayı geç yatırma alışkanlığı burada tahliye sebebine dönüşüyor."
    kanca_kalip: sure
    mevzuat: "Türk Borçlar Kanunu md. 352/2"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiracı, bir yıldan kısa süreli kira sözleşmelerinde kira süresi içinde; bir yıl ve daha uzun süreli kira sözleşmelerinde ise bir kira yılı veya bir kira yılını aşan süre içinde kira bedelini ödemediği için kendisine yazılı olarak iki haklı ihtarda bulunulmasına sebep olmuşsa kiraya veren, kira süresinin ve bir yıldan uzun süreli kiralarda ihtarların yapıldığı kira yılının bitiminden başlayarak bir ay içinde, dava yoluyla kira sözleşmesini sona erdirebilir."
    yerel: null

  - kod: S2-006
    sutun: S2
    bicim: B3
    baslik: "Depozito en fazla kaç kira"
    aci: "Konut kirasında güvence bedeli üç aylık kirayı aşamaz ve para olarak veriliyorsa kiracı adına vadeli hesapta tutulur. Uygulamada neredeyse hiç bilinmiyor."
    kanca_kalip: rakam
    mevzuat: "Türk Borçlar Kanunu md. 342"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Konut ve çatılı işyeri kiralarında sözleşmeyle kiracıya güvence verme borcu getirilmişse, bu güvence üç aylık kira bedelini aşamaz."
    yerel: null

  - kod: S2-007
    sutun: S2
    bicim: B1
    baslik: "Depozito iade edilmezse"
    aci: "Ev sahibi kiracının rızası olmadan depozitoyu tek başına çekemez. Alacağı olduğunu iddia ediyorsa dava veya icra takibi başlatmak zorunda."
    kanca_kalip: kim_hakli
    mevzuat: "Türk Borçlar Kanunu md. 342"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Banka, güvenceleri ancak iki tarafın rızasıyla veya icra takibinin kesinleşmesiyle ya da kesinleşmiş mahkeme kararına dayanarak geri verebilir."
    yerel: null

  - kod: S2-008
    sutun: S2
    bicim: B2
    baslik: "Hangi tadilat kime ait"
    aci: "Olağan kullanımdan doğan küçük bakım kiracıya, yapısal ve zorunlu onarım ev sahibine ait. Kombi, çatı, tesisat, boya — kalem kalem kim öder."
    kanca_kalip: kim_hakli
    mevzuat: "Türk Borçlar Kanunu md. 301, 317"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiracı, kiralananın olağan kullanımı için gerekli temizlik ve bakım giderlerini ödemekle yükümlüdür."

  - kod: S2-009
    sutun: S2
    bicim: B3
    baslik: "Kirayı elden vermek"
    aci: "Elden ödemede makbuz yoksa ispat zorlaşır; ev sahibi ödenmedi derse ödediğini ispat yükü kiracıdadır. Banka dekontuna 'kira' açıklaması yazmak tek güvenli yol."
    kanca_kalip: belge
    mevzuat: null
    yerel: null
    mevzuat_kontrol: "2026-09-24"

  - kod: S2-010
    sutun: S2
    bicim: B1
    baslik: "Ev satılınca kiracı çıkar mı"
    aci: "Satış kira sözleşmesini kendiliğinden bitirmez; yeni malik sözleşmeye taraf olur. Ancak ihtiyaç iddiasıyla, edinme tarihinden itibaren bir ay içinde bildirimde bulunup tahliye isteyebilir."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Türk Borçlar Kanunu md. 310 ve 351"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Sözleşmenin kurulmasından sonra kiralanan herhangi bir sebeple el değiştirirse, yeni malik kira sözleşmesinin tarafı olur."
    yerel: null

  - kod: S2-011
    sutun: S2
    bicim: B3
    baslik: "Kiracı daireyi devredebilir mi"
    aci: "Konut kirasında kiracı, ev sahibinin yazılı rızası olmadan kira ilişkisini devredemez. Rıza yoksa devir tahliye sebebi."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Türk Borçlar Kanunu md. 323"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiracı, kiraya verenin yazılı rızasını almadıkça, kira ilişkisini başkasına devredemez."

  - kod: S2-012
    sutun: S2
    bicim: B1
    baslik: "Kira ödenmezse süreç nasıl işler"
    aci: "Ödenmeyen kira için otuz günlük süre veren ihtar çekilir; süre sonunda ödeme yoksa fesih ve tahliye yolu açılır. Süre yanlış hesaplanırsa dava baştan düşer."
    kanca_kalip: sure
    mevzuat: "Türk Borçlar Kanunu md. 315"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiracıya verilecek süre en az on gün, konut ve çatılı işyeri kiralarında ise en az otuz gündür."
    yerel: null

  - kod: S2-013
    sutun: S2
    bicim: B3
    baslik: "Sözleşme bitince kiracı çıkmak zorunda mı"
    aci: "Hayır. Süre bitiminde sözleşme kendiliğinden bir yıl uzar. Ev sahibinin süre bitti demesi tek başına tahliye sebebi değil."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Türk Borçlar Kanunu md. 347"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiraya veren, sözleşme süresinin bitimine dayanarak sözleşmeyi sona erdiremez."
    yerel: null

  - kod: S2-014
    sutun: S2
    bicim: B3
    baslik: "Aidatı kim öder"
    aci: "Olağan yönetim giderleri kiracıya, demirbaş ve büyük onarım fonu ev sahibine ait. Asansör bakımı ile asansör yenilemesi farklı kalemler."
    kanca_kalip: kim_hakli
    mevzuat: null
    yerel: null

  - kod: S2-015
    sutun: S2
    bicim: B1
    baslik: "Yeniden inşa nedeniyle tahliye"
    aci: "Esaslı onarım veya yeniden inşa için tahliye istenebilir; ama iş, kullanımı imkânsız kılacak nitelikte olmalı. Boya badana bahanesiyle tahliye tutmaz."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Türk Borçlar Kanunu md. 350"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiralananın yeniden inşası veya imarı amacıyla esaslı onarımı, genişletilmesi ya da değiştirilmesi gerekli ve bu işler sırasında kiralananın kullanımı imkânsız ise, belirli süreli sözleşmelerde sürenin sonunda, belirsiz süreli sözleşmelerde kiraya ilişkin genel hükümlere göre fesih dönemine ve fesih bildirimi için öngörülen sürelere uyularak belirlenecek tarihten başlayarak bir ay içinde açacağı dava ile sona erdirebilir."
    yerel: null

  - kod: S2-016
    sutun: S2
    bicim: B3
    baslik: "Kiracının önalım hakkı var mı"
    aci: "Yok. Kiracının, oturduğu evi satın almada yasal önceliği bulunmuyor. En yaygın kira efsanelerinden biri."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Türk Medeni Kanunu md. 732"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Paylı mülkiyette bir paydaşın taşınmaz üzerindeki payını tamamen veya kısmen üçüncü kişiye satması hâlinde, diğer paydaşlar önalım hakkını kullanabilirler."

  - kod: S2-017
    sutun: S2
    bicim: B2
    baslik: "Kiralamak mı satın almak mı"
    aci: "Peşinat, kredi faizi, kira çarpanı ve fırsat maliyeti yan yana konduğunda cevap bölgeye göre değişir. Silivri rakamlarıyla iki senaryo."
    kanca_kalip: rakam
    mevzuat: null
    yerel: "Silivri kira çarpanı ve konut fiyatları"
    engel: "Silivri rakamlarıyla senaryo istiyor ama veri kaynağı yok; kaynaksız rakam yayınlanmaz (2026-09-24)."

  - kod: S2-018
    sutun: S2
    bicim: B3
    baslik: "Kefil ne kadar süre sorumlu"
    aci: "Kira sözleşmesindeki kefaletin yazılı olması, azami tutar ve tarih içermesi gerekir. Bu unsurlar yoksa kefalet geçersiz."
    kanca_kalip: belge
    mevzuat: "Türk Borçlar Kanunu md. 583"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kefalet sözleşmesi, yazılı şekilde yapılmadıkça ve kefilin sorumlu olacağı azamî miktar ile kefalet tarihi belirtilmedikçe geçerli olmaz."

  - kod: S2-019
    sutun: S2
    bicim: B1
    baslik: "Kiracı izinsiz tadilat yaparsa"
    aci: "Kiralananda yenilik ve değişiklik için kiraya verenin yazılı rızası gerekir. Yazılı rıza varsa, yazılı olarak kararlaştırılmadıkça eski hâle getirme istenemez; ama aksine yazılı bir anlaşma yoksa kiracı yaptığı değişikliğin değer artışı için de bedel isteyemez. Rızasız değişiklik kiracıyı uyuşmazlık riskine sokar."
    kanca_kalip: kim_hakli
    mevzuat: "Türk Borçlar Kanunu md. 321"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiracı, kiraya verenin yazılı rızasıyla kiralananda yenilik ve değişiklikler yapabilir."

  - kod: S2-020
    sutun: S2
    bicim: B3
    baslik: "Ev sahibi habersiz eve girebilir mi"
    aci: "Giremez. Kiralanan kiracının zilyetliğindedir; izinsiz giriş konut dokunulmazlığını ihlal eder. Anahtarın ev sahibinde olması bu durumu değiştirmez."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Türk Borçlar Kanunu md. 319"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kiraya veren, çalışmaları ve kiralananın gezilip görüleceğini uygun bir süre önce kiracıya bildirmek ve bunların yapıldığı sırada kiracının yararlarını göz önünde tutmak zorundadır."
    yerel: null

