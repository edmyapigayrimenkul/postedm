    bicim: B3
    baslik: "Tacir kiracının ayrıcalığı bitti"
    aci: "6217 sayılı Kanunun geçici 2. maddesi, kiracının tacir ya da tüzel kişi olduğu işyeri kiralarında Borçlar Kanununun bazı kira hükümlerini 1/7/2012'den itibaren 8 yıl süreyle uygulanmaz kılıyordu. Bu süre 1 Temmuz 2020'de doldu: güvence bedeli üç aylık kirayı aşamaz ve kira bedeli ile yan giderler dışında ödeme yükümlülüğü getirilemez kuralları artık tacir kiracılar için de geçerli."
