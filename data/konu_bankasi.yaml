    aci: "Riskli yapıda karar, hisseleri oranında paydaşların salt çoğunluğuyla alınır; eski, daha yüksek çoğunluk kuralı yürürlükte değil. Karar ve teklif, katılmayan maliklere noter ya da muhtarlıkta on beş günlük ilanla bildirilir. Karara katılmayanların payları Başkanlıkça belirlenen rayiç değerden az olmamak üzere anlaşan paydaşlara açık artırmayla satılır."
