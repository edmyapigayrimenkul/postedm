# =========================================================
# EDM — Evergreen Konu Bankası
# Sistem kuralları: ICERIK-SISTEMI.md
#
# Bu havuz botun konu kaynağıdır. Model artık konu UYDURMAZ;
# buradaki brief'i işler. Brief ne kadar iyiyse çıktı o kadar iyidir.
#
# Alanlar:
#   kod         Kalıcı kimlik. Silinmez, yeniden kullanılmaz (tekrar takibi buna bakar)
#   sutun       S1 Tapu&Hukuk | S2 Kiracı&EvSahibi | S3 Arsa&İmar | S4 Rakam&Bölge
#   bicim       B1 RiskDosyası | B2 Karşılaştırma | B3 TekKare | B4 RakamKarnesi
#   baslik      İç kullanım. Manşet DEĞİL — manşeti model kancadan üretir
#   aci         Bunu paylaşmaya değer kılan şey. Prompt'un merkezi
#   kanca_kalip ICERIK-SISTEMI.md §6'daki kalıplardan biri
#   mevzuat     Yalnızca doğrulanmış madde. Emin değilsek null — model de uydurmaz
#   yerel       Silivri/Trakya bağı. Zorlama olacaksa null
#   mevzuat_kontrol  Brief'in güncel kanun metniyle son karşılaştırıldığı tarih
#   dayanak_alintisi  Atıf yapılan maddenin GÜNCEL metninden birebir bir cümle (kanıt). Haftalık denetim
#                     (scripts/mevzuat_denetim.py) alıntının hâlâ metinde durduğunu ve aci'deki süre,
#                     oran, çoğunluğun metinde geçtiğini doğrular; kanun değişirse konu kırmızıya düşer.
#                     2026-10-07'den itibaren eklenen her konuda ZORUNLU. Eski konuların kanuna dayananlarına
#                     da eklendi (77 konu); yönetmelik, tebliğ, genelge ve kurul kararına dayananlarda (12 konu)
#                     kanun metni önbelleği olmadığı için yok, elle doğrulanır (mevzuat_denetim.py listeler).
#   engel       Doluysa konu üretime ALINMAZ (dayanağı doğrulanamadı vb.) — gerekçe yazılır
#   Denetim: python scripts/mevzuat_denetim.py (haftalık iş akışı da çalıştırır)
# =========================================================

konular:

  # ---------------------------------------------------------
  # S1 — TAPU & HUKUK  (kaydettirir)
  # ---------------------------------------------------------

  - kod: S1-001
    sutun: S1
    bicim: B1
    baslik: "Hisseli tapuda önalım (şufa) davası"
    aci: "Hisseli taşınmazda bir paydaş payını satarsa diğer paydaşlar önalım hakkını kullanabilir. Satış noterle bildirildiyse bildirimden itibaren üç ay, her hâlde satıştan itibaren bir yıl içinde dava açılabilir. 7571 sayılı Kanunla (24/12/2025) üst süre kısaltıldı ve payın bedelini artık tapudaki rakam değil hâkimin belirlediği rayiç değer belirliyor. İnternetteki içeriğin çoğu eski kuralla yazılmış."
    kanca_kalip: sure
    mevzuat: "Türk Medeni Kanunu md. 732-734"
    yerel: "Trakya'da tarla ve bağ-bahçe tapularının önemli bölümü hisseli"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Önalım hakkı, satışın hak sahibine bildirildiği tarihin üzerinden üç ay ve her hâlde satışın üzerinden bir yıl geçmekle düşer."

  - kod: S1-002
    sutun: S1
    bicim: B1
    baslik: "Tapuda satış bedelini düşük göstermek"
    aci: "Harç kaçırmak için bedeli düşük göstermek önalımda da işe yaramıyor: 7571 sayılı Kanundan (24/12/2025) beri önalımda payın bedelini hâkim rayiç değer olarak belirliyor. Asıl sonuç vergisel: tapu harcı beyan edilen bedel üzerinden alınır ve emlak vergisi değerinden az olamaz; eksik beyan vergi ziyaı cezası ve gecikme faiziyle geri döner, zamanaşımı beş yıl."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Harçlar Kanunu md. 63, Vergi Usul Kanunu md. 114 ve 344, Türk Medeni Kanunu md. 734"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Gayrimenkul devir ve iktisaplarında tapu ve kadastro harcı, emlak vergisi değerinden az olmamak üzere, beyan edilen devir ve iktisap bedeli üzerinden hesaplanır."

  - kod: S1-003
    sutun: S1
    bicim: B3
    baslik: "Kaparo geri alınır mı"
    aci: "Kaparo kanunda 'bağlanma parası'dır: sözleşmenin yapıldığını gösterir, aksi kararlaştırılmadıkça bedelden düşülür. 'Vazgeçen kaybeder, alan iki katını öder' kuralı yalnızca açıkça kararlaştırılmış cayma parası için geçerli. Taşınmaz satış vaadi de ancak resmî şekilde (noterde düzenleme) geçerli; adi protokole güvenen alıcı korunmaz."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Türk Borçlar Kanunu md. 177, 178 ve 237"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Aksine sözleşme veya yerel âdet olmadıkça, bağlanma parası esas alacaktan düşülür."

  - kod: S1-004
    sutun: S1
    bicim: B1
    baslik: "Tapudaki şerhler ne anlatır"
    aci: "Şerhler ve beyanlar hanesindeki tek satır, mülkün satışını kilitleyebilir ya da alıcıyı üçüncü kişinin hakkına bağlayabilir. İpotek, haciz, irtifak, aile konutu şerhi — hangisi ne demek."
    kanca_kalip: belge
    mevzuat: "Türk Medeni Kanunu md. 194, 1009, 1010"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Bunlar şerh verilmekle o taşınmaz üzerinde sonradan kazanılan hakların sahiplerine karşı ileri sürülebilir."

  - kod: S1-005
    sutun: S1
    bicim: B3
    baslik: "Vekâletle satışta sahtecilik"
    aci: "Vekâletname iptal edilmiş olabilir ve tapu bunu resen kontrol etmez. Satıştan önce noterden vekâletin güncelliğini teyit etmek beş dakikalık iş, atlanınca dönüşü yok."
    kanca_kalip: belge
    mevzuat: null
    yerel: null
    engel: "Aci'deki 'tapu vekâletnameyi resen kontrol etmez' iddiası doğrulanamadı; tapu müdürlükleri noter sistemiyle vekâletname sorgulaması yapıyor olabilir. Doğrulanmadan yayınlanmaz (2026-09-24)."

  - kod: S1-006
    sutun: S1
    bicim: B1
    baslik: "Aile konutu şerhi"
    aci: "Eşin açık rızası olmadan aile konutu devredilemez. Tapuda şerh olmasa da diğer eş satışa karşı dava açabilir; alıcının durumu iyi niyetine göre değerlendirilir. Alıcı için güvenli yol, satıcının medeni durumunu ve konutun aile konutu olup olmadığını baştan netleştirip eşin açık rızasını almak."
    kanca_kalip: eksik_imza
    mevzuat: "Türk Medeni Kanunu md. 194 ve 1023"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Eşlerden biri, diğer eşin açık rızası bulunmadıkça, aile konutu ile ilgili kira sözleşmesini feshedemez, aile konutunu devredemez veya aile konutu üzerindeki hakları sınırlayamaz."

  - kod: S1-007
    sutun: S1
    bicim: B1
    baslik: "Mirasçılardan biri satışa karşı çıkarsa"
    aci: "Elbirliği mülkiyetinde tek bir mirasçı satışı kilitler. Çözüm ortaklığın giderilmesi davası: mal aynen bölünemiyorsa dava açık artırmayla satışa gider ve fiyatı pazarlık değil ihale belirler."
    kanca_kalip: kim_hakli
    mevzuat: "Türk Medeni Kanunu md. 640, 698, 699, 701, 702"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kanunda veya sözleşmede aksine bir hüküm bulunmadıkça, gerek yönetim, gerek tasarruf işlemleri için ortakların oybirliğiyle karar vermeleri gerekir."

  - kod: S1-008
    sutun: S1
    bicim: B3
    baslik: "Tapu devri kaç günde biter"
    aci: "Randevu, harç, DASK, ekspertiz — sıralama bilinirse tek günde biter. Sıralama bilinmezse üç haftaya yayılır. Zorunlu evrakların net listesi."
    kanca_kalip: belge
    mevzuat: null
    yerel: null

  - kod: S1-009
    sutun: S1
    bicim: B1
    baslik: "Kat irtifakı ile kat mülkiyeti farkı"
    aci: "Kat irtifakı, yapı henüz tamamlanmadan ya da yapı kullanma izni (iskân) alınmadan önceki aşamanın tapusudur; kat mülkiyetine geçiş iskânla olur. İskânı olmayan bina kredi ve satışta sorun çıkarır; ruhsat ve projeye aykırılık varsa ayrıca imar yaptırımları gündeme gelir."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Kat Mülkiyeti Kanunu md. 3 ve 14"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kat irtifakı arsa payına bağlı bir irtifak çeşidi olup, yapının tamamı için düzenlenecek yapı kullanma izin belgesine dayalı olarak, bu Kanunda gösterilen şartlar uyarınca kat mülkiyetine resen çevrilir."

  - kod: S1-010
    sutun: S1
    bicim: B3
    baslik: "İskânsız daire alınır mı"
    aci: "Yapı kullanma izni olmayan yapıda izin alınana kadar elektrik, su ve kanalizasyon hizmetinden yararlanılamaz; kredi ve resmî abonelikte de sorun çıkar. Bazı bankalar hiç kredi vermez. Fiyat cazipse sebebi genelde budur."
    kanca_kalip: yaygin_yanlis
    mevzuat: "İmar Kanunu md. 30 ve 31"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Kullanma izni verilmeyen ve alınmayan yapılarda izin alınıncaya kadar elektrik, su ve kanalizasyon hizmetlerinden ve tesislerinden faydalandırılmazlar."

  - kod: S1-011
    sutun: S1
    bicim: B1
    baslik: "Ön ödemeli konut satışında cayma hakkı"
    aci: "Projeden satın alan tüketicinin on dört gün içinde gerekçesiz cayma hakkı var ve teslim gecikirse sözleşmeyi feshedebilir. Müteahhitler bunu genelde hatırlatmaz."
    kanca_kalip: sure
    mevzuat: "6502 sayılı Kanun md. 40, 43, 44"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Tüketici, on dört gün içinde herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin ön ödemeli konut satış sözleşmesinden cayma hakkına sahiptir."

  - kod: S1-012
    sutun: S1
    bicim: B3
    baslik: "Tapu harcı kim öder"
    aci: "Kanunen alıcı ve satıcı yarı yarıya. Uygulamada tamamı alıcıya yıkılıyor. Pazarlıkta bilinmesi doğrudan paraya dönüşen bir madde."
    kanca_kalip: kim_hakli
    mevzuat: "Harçlar Kanunu md. 63"
    yerel: null
    mevzuat_kontrol: "2026-09-24"
    engel: "'Kanunen alıcı ve satıcı yarı yarıya' iddiası doğrulanamadı: dayanak gösterilen Harçlar Kanunu md. 63 harcın kim tarafından ödeneceğini söylemiyor, alıcı-satıcı oranı (4) sayılı tarifede ve kanun metni önbelleğinde tarife yok. Dayanağı bulunana kadar yayınlanmaz (2026-10-07)."

  - kod: S1-013
    sutun: S1
    bicim: B1
    baslik: "Zilyetlikle tapu kazanma"
    aci: "Tapuda kayıtlı olmayan bir taşınmazı yirmi yıl davasız, aralıksız ve malik sıfatıyla kullanan kişi tescil davası açabilir; dava Hazine'ye ve ilgili kamu tüzel kişilerine karşı açılır. Mera, orman, kıyı gibi özel kanunlarla korunan yerlerde bu yol işlemez. Köy yerinde en çok yanlış bilinen konu."
    kanca_kalip: sure
    mevzuat: "Türk Medeni Kanunu md. 713"
    yerel: "Trakya köylerinde tapusuz kullanım yaygın"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Tapu kütüğünde kayıtlı olmayan bir taşınmazı davasız ve aralıksız olarak yirmi yıl süreyle ve malik sıfatıyla zilyetliğinde bulunduran kişi, o taşınmazın tamamı, bir parçası veya bir payı üzerindeki mülkiyet hakkının tapu kütüğüne tesciline karar verilmesini isteyebilir."

  - kod: S1-014
    sutun: S1
    bicim: B3
    baslik: "Emlakçı komisyonu ne zaman hak edilir"
    aci: "Komisyon, tarafları buluşturup sözleşme kurulmasını sağlamakla hak edilir. Satış olmadan komisyon istenemez; yetki sözleşmesinde kararlaştırıldıysa, emlakçıyı devre dışı bırakan satışta da ücret gündeme gelebilir."
    kanca_kalip: kim_hakli
    mevzuat: "Türk Borçlar Kanunu md. 520, 521"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Simsar, ancak yaptığı faaliyet sonucunda sözleşme kurulursa ücrete hak kazanır."

  - kod: S1-015
    sutun: S1
    bicim: B1
    baslik: "Kentsel dönüşümde uzlaşmazsanız"
    aci: "Riskli yapıda karar, hisseleri oranında paydaşların salt çoğunluğuyla alınır; eski, daha yüksek çoğunluk kuralı yürürlükte değil. Karar ve teklif, katılmayan maliklere noter ya da muhtarlıkta on beş günlük ilanla bildirilir. Karara katılmayanların payları Başkanlıkça belirlenen rayiç değerden az olmamak üzere anlaşan paydaşlara açık artırmayla satılır."
    kanca_kalip: sure
    mevzuat: "6306 sayılı Kanun md. 6"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "yapının paydaşı olup olmadıkları gözetilmeksizin sahip oldukları hisseleri oranında paydaşların salt çoğunluğu ile karar verilir."

