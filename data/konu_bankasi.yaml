    mevzuat_kontrol: "2026-09-24"

  - kod: S3-001
    sutun: S3
    bicim: B1
    baslik: "Tarlaya tiny house veya konteyner"
    aci: "Tarım arazisine kalıcı yapı konulması ruhsata tabi. Ruhsatsız yapı yıkım ve idari para cezası doğurur; üstelik yapı kayıt belgesi de bu durumu kurtarmıyor."
    kanca_kalip: yaygin_yanlis
    mevzuat: "İmar Kanunu md. 21 ve 32"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "belediye veya valiliklerce o andaki inşaat durumu tespit edilir. Yapı mühürlenerek inşaat derhal durdurulur."
    yerel: "Silivri ve Trakya'da tarla üzerine tiny house talebi yoğun"

  - kod: S3-002
    sutun: S3
    bicim: B1
    baslik: "TAKS ve KAKS nasıl okunur"
    aci: "TAKS zeminde kaplayabileceğin alanı, KAKS toplam inşaat hakkını verir. İkisi bilinmeden arsanın gerçek değeri hesaplanamaz — metrekare fiyatı tek başına yanıltıcı."
    kanca_kalip: rakam
    mevzuat: null
    yerel: null

  - kod: S3-003
    sutun: S3
    bicim: B3
    baslik: "Yola cephesi olmayan arsa"
    aci: "Genel yola çıkışı olmayan parselde yapı ruhsatı almak çoğu zaman mümkün olmaz. Çözüm geçit hakkı veya tevhid — ikisi de komşuya bağlı olduğu için fiyatı doğrudan düşürür."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Türk Medeni Kanunu md. 747"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Taşınmazından genel yola çıkmak için yeterli geçidi bulunmayan malik, tam bir bedel karşılığında bir geçit hakkı tanınmasını komşularından isteyebilir."

  - kod: S3-004
    sutun: S3
    bicim: B1
    baslik: "İmar uygulaması ve DOP kesintisi"
    aci: "18. madde uygulamasında arsadan düzenleme ortaklık payı kesilir. Kesinti sonrası elinize geçen metrekare, aldığınızdan belirgin biçimde az olabilir."
    kanca_kalip: rakam
    mevzuat: "3194 sayılı İmar Kanunu md. 18"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Ancak, bu maddeye göre alınacak düzenleme ortaklık payları, düzenlemeye tabi tutulan arazi ve arsaların düzenlemeden önceki yüzölçümlerinin yüzde kırk beşini geçemez."
    yerel: null

  - kod: S3-005
    sutun: S3
    bicim: B3
    baslik: "Tarım arazisi bölünebilir mi"
    aci: "Tarım arazileri Bakanlığın belirlediği asgari büyüklüğün altında ifraz edilemez, hisselendirilemez; pay ve paydaş sayısı da artırılamaz. 'Bölünemiyorsa hisseli satarız' yolu kanunen kapalı — hisseli tarla ilanında tapu işleminin yapılıp yapılamayacağı baştan sorgulanmalı."
    kanca_kalip: yaygin_yanlis
    mevzuat: "5403 sayılı Toprak Koruma ve Arazi Kullanımı Kanunu md. 8"
    yerel: "Trakya'daki hisseli tarla ilanlarının sebebi"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Tarım arazileri Bakanlıkça belirlenen büyüklüklerin altında ifraz edilemez, hisselendirilemez, Hazine taşınmazlarının satış işlemleri hariç olmak üzere pay ve paydaş adedi artırılamaz."

  - kod: S3-006
    sutun: S3
    bicim: B1
    baslik: "Hisseli tarlada kim nereyi kullanır"
    aci: "Hisse, tapuda oran demek — zeminde belirli bir parça demek değil. Paydaşlar fiilen taksim etse bile bu taksim hukuken bağlayıcı olmayabilir."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Türk Medeni Kanunu md. 688, 691"
    yerel: "Trakya'da hisseli tarla alımının en büyük anlaşmazlık kaynağı"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Paylı mülkiyette birden çok kimse, maddî olarak bölünmüş olmayan bir şeyin tamamına belli paylarla maliktir."

  - kod: S3-007
    sutun: S3
    bicim: B3
    baslik: "İfraz ve tevhid nedir"
    aci: "İfraz parseli böler, tevhid birleştirir. İkisi de imar planına ve asgari parsel şartına bağlı; plan uygun değilse başvuru reddedilir."
    kanca_kalip: belge
    mevzuat: "İmar Kanunu md. 15, 16"
    yerel: null
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Parselasyon planı tescil edilmiş yerlerde yapılacak ifraz veya tevhidin imar planlarına ve imar mevzuatına uygun olması şarttır."

  - kod: S3-008
    sutun: S3
    bicim: B1
    baslik: "İmar planı değişirse arsanız ne olur"
    aci: "Plan revizyonu emsali artırabilir de düşürebilir de. Yeşil alana veya yola isabet eden parseller kamulaştırma sırasına girer ve yıllarca bekler."
    kanca_kalip: sure
    mevzuat: null
    yerel: null

  - kod: S3-009
    sutun: S3
    bicim: B3
    baslik: "Hazine arazisi kiralanır mı"
    aci: "Kiralanabilir ama kira mülkiyet doğurmaz. Üzerine yapılan yapı da hazineye kalır. Ucuz görünen bu yolun sonu genelde hüsran."
    kanca_kalip: yaygin_yanlis
    mevzuat: null
    yerel: null

  - kod: S3-010
    sutun: S3
    bicim: B1
    baslik: "Kadastro ile tapu ölçüsü tutmuyorsa"
    aci: "Tapudaki yüzölçümü ile zemindeki ölçü farklıysa esas olan kadastro paftasıdır. Fark çoğu zaman alım anında fark edilmiyor."
    kanca_kalip: rakam
    mevzuat: null
    yerel: null
    mevzuat_kontrol: "2026-09-24"

  - kod: S3-011
    sutun: S3
    bicim: B3
    baslik: "Bağ evi yapılabilir mi"
    aci: "Belirli büyüklüğün üzerindeki tarım arazisinde, tarımsal amaca hizmet etmesi şartıyla ve izinle mümkün. İzinsiz yapılan bağ evi kaçak yapıdır."
    kanca_kalip: yaygin_yanlis
    mevzuat: null
    yerel: "Silivri kırsalında en sık sorulan soru"

  - kod: S3-012
    sutun: S3
    bicim: B2
    baslik: "İmarlı arsa mı tarla mı"
    aci: "Tarla ucuz ama imara girme ihtimali belirsiz ve süresi öngörülemez. İmarlı arsa pahalı ama bugün inşaat hakkı var. İki senaryonun beş yıllık karşılaştırması."
    kanca_kalip: rakam
    mevzuat: null
    yerel: "Silivri kuzey aksı örneği"
    engel: "Beş yıllık karşılaştırma istiyor ama veri kaynağı yok; kaynaksız rakam yayınlanmaz (2026-09-24)."

  - kod: S3-013
    sutun: S3
    bicim: B3
    baslik: "Arsa vasfı nasıl öğrenilir"
    aci: "Tapudaki nitelik yeterli değil. Belediyeden imar durumu belgesi alınmadan arsanın ne yapılabileceği bilinemez."
    kanca_kalip: belge
    mevzuat: null
    yerel: null
    mevzuat_kontrol: "2026-09-24"

  - kod: S3-014
    sutun: S3
    bicim: B1
    baslik: "Kamulaştırmasız el atma"
    aci: "İdare arsanıza fiilen el attıysa veya plan yoluyla kullanımı tamamen kısıtladıysa bedel davası açılabilir. Çoğu malik bu hakkı bilmediği için sessiz kalıyor."
    kanca_kalip: yaygin_yanlis
    mevzuat: null
    yerel: null

  - kod: S3-015
    sutun: S3
    bicim: B3
    baslik: "Yapı kayıt belgesi neyi çözer"
    aci: "Yapı Kayıt Belgesi (imar barışı) bağlı yıkım kararını ve tahsil edilemeyen idari para cezasını iptal eder, geçici su, elektrik ve doğalgaz bağlanmasını sağlar; ama belge yapının kullanım amacına yöneliktir, yapıyı imara uygun hâle getirmez."
    kanca_kalip: yaygin_yanlis
    mevzuat: "İmar Kanunu geçici madde 16"
    mevzuat_kontrol: "2026-10-07"
    dayanak_alintisi: "Yapı Kayıt Belgesi yapının kullanım amacına yöneliktir."
    yerel: null

