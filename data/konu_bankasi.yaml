# =========================================================
# EDM — Evergreen Konu Bankası
# Sistem kuralları: ICERIK-SISTEMI.md
#
# Bu havuz botun konu kaynağıdır. Model artık konu UYDURMAZ;
# buradaki brief'i işler. Brief ne kadar iyiyse çıktı o kadar iyidir.
#
# Alanlar:
#   kod         Kalıcı kimlik. Silinmez, yeniden kullanılmaz (tekrar takibi buna bakar)
#   sutun       S1 Tapu&Hukuk | S2 Kiracı&EvSahibi | S3 Arsa&İmar | S4 Rakam&Bölge
#   bicim       B1 RiskDosyası | B2 Karşılaştırma | B3 TekKare | B4 RakamKarnesi
#   baslik      İç kullanım. Manşet DEĞİL — manşeti model kancadan üretir
#   aci         Bunu paylaşmaya değer kılan şey. Prompt'un merkezi
#   kanca_kalip ICERIK-SISTEMI.md §6'daki kalıplardan biri
#   mevzuat     Yalnızca doğrulanmış madde. Emin değilsek null — model de uydurmaz
#   yerel       Silivri/Trakya bağı. Zorlama olacaksa null
#   mevzuat_kontrol  Brief'in güncel kanun metniyle son karşılaştırıldığı tarih
#   engel       Doluysa konu üretime ALINMAZ (dayanağı doğrulanamadı vb.) — gerekçe yazılır
#   Denetim: python scripts/mevzuat_denetim.py (haftalık iş akışı da çalıştırır)
# =========================================================

konular:

  # ---------------------------------------------------------
  # S1 — TAPU & HUKUK  (kaydettirir)
  # ---------------------------------------------------------

  - kod: S1-001
    sutun: S1
    bicim: B1
    baslik: "Hisseli tapuda önalım (şufa) davası"
    aci: "Hisseli taşınmazda bir paydaş payını satarsa diğer paydaşlar önalım hakkını kullanabilir. Satış noterle bildirildiyse bildirimden itibaren üç ay, her hâlde satıştan itibaren bir yıl içinde dava açılabilir. 7571 sayılı Kanunla (24/12/2025) üst süre kısaltıldı ve payın bedelini artık tapudaki rakam değil hâkimin belirlediği rayiç değer belirliyor. İnternetteki içeriğin çoğu eski kuralla yazılmış."
    kanca_kalip: sure
    mevzuat: "Türk Medeni Kanunu md. 732-734"
    yerel: "Trakya'da tarla ve bağ-bahçe tapularının önemli bölümü hisseli"
    mevzuat_kontrol: "2026-09-24"

  - kod: S1-002
    sutun: S1
    bicim: B1
    baslik: "Tapuda satış bedelini düşük göstermek"
    aci: "Harç kaçırmak için bedeli düşük göstermek önalımda da işe yaramıyor: 7571 sayılı Kanundan (24/12/2025) beri önalımda payın bedelini hâkim rayiç değer olarak belirliyor. Asıl sonuç vergisel: tapu harcı beyan edilen bedel üzerinden alınır ve emlak vergisi değerinden az olamaz; eksik beyan vergi ziyaı cezası ve gecikme faiziyle geri döner, zamanaşımı beş yıl."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Harçlar Kanunu md. 63, Vergi Usul Kanunu md. 114 ve 344, Türk Medeni Kanunu md. 734"
    yerel: null
    mevzuat_kontrol: "2026-09-24"

  - kod: S1-003
    sutun: S1
    bicim: B3
    baslik: "Kaparo geri alınır mı"
    aci: "Kaparo kanunda 'bağlanma parası'dır: sözleşmenin yapıldığını gösterir, aksi kararlaştırılmadıkça bedelden düşülür. 'Vazgeçen kaybeder, alan iki katını öder' kuralı yalnızca açıkça kararlaştırılmış cayma parası için geçerli. Taşınmaz satış vaadi de ancak resmî şekilde (noterde düzenleme) geçerli; adi protokole güvenen alıcı korunmaz."
    kanca_kalip: yaygin_yanlis
    mevzuat: "Türk Borçlar Kanunu md. 177, 178 ve 237"
    yerel: null
    mevzuat_kontrol: "2026-09-24"

  - kod: S1-004
    sutun: S1
    bicim: B1
    baslik: "Tapudaki şerhler ne anlatır"
    aci: "Şerhler ve beyanlar hanesindeki tek satır, mülkün satışını kilitleyebilir ya da alıcıyı üçüncü kişinin hakkına bağlayabilir. İpotek, haciz, irtifak, aile konutu şerhi — hangisi ne demek."
    kanca_kalip: belge
    mevzuat: "Türk Medeni Kanunu md. 194, 1009, 1010"
    yerel: null
    mevzuat_kontrol: "2026-09-24"

  - kod: S1-005
    sutun: S1
    bicim: B3
    baslik: "Vekâletle satışta sahtecilik"
    aci: "Vekâletname iptal edilmiş olabilir ve tapu bunu resen kontrol etmez. Satıştan önce noterden vekâletin güncelliğini teyit etmek beş dakikalık iş, atlanınca dönüşü yok."
    kanca_kalip: belge
    mevzuat: null
    yerel: null
    engel: "Aci'deki 'tapu vekâletnameyi resen kontrol etmez' iddiası doğrulanamadı; tapu müdürlükleri noter sistemiyle vekâletname sorgulaması yapıyor olabilir. Doğrulanmadan yayınlanmaz (2026-09-24)."

