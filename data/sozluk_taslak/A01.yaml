kartlar:
  - terim: "MÜLKİYET HAKKI"
    kategori_kodu: "TAPU_VE_HUKUK"
    mevzuat: "4721 sayılı Kanun md. 683"
    dayanak_alintisi: "Bir şeye malik olan kimse, hukuk düzeninin sınırları içinde, o şey üzerinde dilediği gibi kullanma, yararlanma ve tasarrufta bulunma yetkisine sahiptir."
    tanim: "Bir kimseye sahibi olduğu şey üzerinde hukuk düzeninin sınırları içinde dilediği gibi kullanma, yararlanma ve tasarruf etme yetkisi tanıyan ayni haktır."
    puf:
      - "Malik, malını haksız olarak elinde bulunduran kimseye karşı doğrudan istihkak davası açabilir."
      - "Malik, mülkiyet hakkına yönelen her türlü haksız elatmanın (müdahalenin) önlenmesini dava edebilir."
    kontrol: "2026-10-18"
    inceleme: "duzeltildi"
    inceleme_notu: "puf[1]'deki kanunda olmayan Anayasa md. 35 kaynaklı 'kamu yararı' ifadesi yerine TMK md. 683/2'de açıkça düzenlenen haksız elatmanın önlenmesi davası işlendi; puf[0] ile istihkak ve elatmanın önlenmesi iki ayrı yasal koruma olarak metne sadık biçimde ayrıldı."

  - terim: "BÜTÜNLEYİCİ PARÇA"
    kategori_kodu: "TAPU_VE_HUKUK"
    mevzuat: "4721 sayılı Kanun md. 684"
    dayanak_alintisi: "Bir şeye malik olan kimse, o şeyin bütünleyici parçalarına da malik olur."
    tanim: "Yerel âdetlere göre asıl şeyin temel unsuru sayılan ve o şey yok edilmedikçe veya yapısı bozulmadıkça ondan ayrılması mümkün olmayan parçadır."
    puf:
      - "Asıl şeye malik olan kimse, kanun gereği o şeyin bütünleyici parçalarına da doğrudan malik olur."
      - "Bir unsurun bütünleyici parça sayılıp sayılmayacağı değerlendirilirken yerel âdetler esas alınır."
    kontrol: "2026-10-18"
    inceleme: "duzeltildi"
    inceleme_notu: "puf[0]'daki md. 684'te yer almayan ve md. 718/722 kapsamına giren bina/ağaç eklemesi ile puf[1]'deki doktriner ifade kaldırıldı; md. 684 metnindeki mülkiyetin kapsamı ve yerel âdetler kuralı doğrudan işlendi."

  - terim: "DOĞAL ÜRÜNLER"
    kategori_kodu: "TAPU_VE_HUKUK"
    mevzuat: "4721 sayılı Kanun md. 685"
    dayanak_alintisi: "Doğal ürünler asıl şeyden ayrılıncaya kadar onun bütünleyici parçasıdır."
    tanim: "Bir şeyden dönemsel olarak elde edilen doğal veya hukukî ürünler ile amaca ve âdete uygun olarak sağlanan diğer verimlerdir."
    puf:
      - "Bir şeyin maliki, aksine yasal kural veya hak olmadıkça o şeyin ürünlerinin de maliki olur."
      - "Doğal ürünler, asıl şeyden ayrılıncaya kadar onun bütünleyici parçası sayılır ve ona tabi olur."
    kontrol: "2026-10-18"
    inceleme: "duzeltildi"
    inceleme_notu: "puf[0]'da kanun metninde bulunmayan 'tarladaki ekin, ağaçtaki meyve' örnekleri yerine md. 685/1'deki malikin ürünlerin de maliki olacağı kuralı ve md. 685/3'teki bütünleyici parça niteliği kanun metnine tam uyumlu hale getirildi."

  - terim: "YARARLANMA ANLAŞMASI"
    kategori_kodu: "TAPU_VE_HUKUK"
    mevzuat: "4721 sayılı Kanun md. 689"
    dayanak_alintisi: "Taşınmazlarla ilgili anlaşmalar imzalarının noterlikçe onaylanması koşuluyla paydaşlardan birinin başvurusu üzerine tapu kütüğüne şerh verilebilir."
    tanim: "Paylı mülkiyette paydaşların oybirliğiyle malın kullanılması, yararlanılması ve yönetimine ilişkin kanundan farklı kurallar belirledikleri sözleşmedir."
    puf:
      - "İmzaları noterlikçe onaylanan anlaşma, paydaşlardan birinin başvurusuyla tapu kütüğüne şerh verilebilir."
      - "Eşyanın korunması için zorunlu yönetim işleri ve acil önlem alma hakları anlaşmayla dahi kaldırılamaz."
    kontrol: "2026-10-18"
    inceleme: "duzeltildi"
    inceleme_notu: "puf[0]'daki md. 689 metninde geçmeyen 'yeni paydaşları bağlar' yorumu yerine fıkra 3'teki noter onayı ve tapuya şerh şartı yazıldı; puf[1]'e fıkra 2'deki zorunlu yönetim ve acil önlem yetkilerinin kaldırılamayacağı kuralı tam metinle işlendi."

  - terim: "PAYLAŞMA İSTEMİ"
    kategori_kodu: "TAPU_VE_HUKUK"
    mevzuat: "4721 sayılı Kanun md. 698"
    dayanak_alintisi: "Paylaşmayı isteme hakkı, hukukî bir işlemle en çok on yıllık süre ile sınırlandırılabilir."
    tanim: "Paylı mülkiyette her bir paydaşın, kanuni veya sözleşmesel bir engel bulunmadıkça malın paylaşılmasını talep etme hakkıdır."
    puf:
      - "Taşınmazlarda paylı mülkiyetin devamına ilişkin sözleşmeler resmî şekle bağlıdır ve tapuya şerh verilebilir."
      - "Paylaşmayı isteme hakkı en çok on yıl sınırlandırılabilir; uygun olmayan zamanda paylaşma isteminde bulunulamaz."
    kontrol: "2026-10-18"
    inceleme: "duzeltildi"
    inceleme_notu: "puf[0]'ın dayanak alıntısını aynen tekrarlaması engellendi; md. 698 son fıkrasında yer alan 'uygun olmayan zamanda paylaşma istenemez' temel yasal kısıtlaması ile resmî şekil ve tapu şerhi koşulları tamamlandı."

  - terim: "TAŞINMAZ MÜLKİYETİ"
    kategori_kodu: "TAPU_VE_HUKUK"
    mevzuat: "4721 sayılı Kanun md. 704"
    dayanak_alintisi: "Taşınmaz mülkiyetinin konusu şunlardır: 1. Arazi, 2. Tapu kütüğünde ayrı sayfaya kaydedilen bağımsız ve sürekli haklar, 3. Kat mülkiyeti kütüğüne kayıtlı bağımsız bölümler."
    tanim: "Kanunen arazi, tapuda ayrı sayfaya kaydedilen bağımsız ve sürekli haklar ile kat mülkiyetine tabi bağımsız bölümler üzerindeki mülkiyettir."
    puf:
      - "Bağımsız ve sürekli hakların taşınmaz mülkiyetine konu olabilmesi için tapuda ayrı sayfaya kaydı zorunludur."
      - "Kat mülkiyeti kütüğüne kayıtlı bağımsız bölümler de müstakil birer taşınmaz mülkiyeti konusu oluşturur."
    kontrol: "2026-10-18"
    inceleme: "duzeltildi"
    inceleme_notu: "puf[0]'daki md. 704'te yer almayan doktrin/tüzük kaynaklı 'yeryüzü parçası' tanımı ile puf[1]'deki 'üst hakkı gibi' örneği kaldırıldı; md. 704'ün 2. ve 3. bentlerindeki tapu kütüğüne ayrı sayfaya kayıt ve kat mülkiyeti unsurları doğrudan işlendi."

  - terim: "TESCİL İLKESİ"
    kategori_kodu: "TAPU_VE_HUKUK"
    mevzuat: "4721 sayılı Kanun md. 705"
    dayanak_alintisi: "Taşınmaz mülkiyetinin kazanılması, tescille olur."
    tanim: "Taşınmaz mülkiyetinin kazanılmasının kural olarak tapu kütüğüne tescil yapılmasıyla gerçekleşeceğini öngören temel ilkedir."
    puf:
      - "Miras, mahkeme kararı, cebrî icra, işgal ve kamulaştırma hâllerinde mülkiyet tescilden önce kazanılır."
      - "Tescilsiz kazanılan hâllerde de malikin tasarruf işlemi yapabilmesi tapu kütüğüne tescil edilmiş olmasına bağlıdır."
    kontrol: "2026-10-18"
    inceleme: "duzeltildi"
    inceleme_notu: "puf[0]'da kanundaki kapalı listeden eksik bırakılan 'işgal ve kamulaştırma' halleri tamamlandı; puf[1]'de doktriner 'satış veya rehin' yerine kanunun 'tasarruf işlemleri yapabilmesi' ifadesi işlendi."

  - terim: "RESMÎ ŞEKİL ŞARTI"
    kategori_kodu: "TAPU_VE_HUKUK"
    mevzuat: "4721 sayılı Kanun md. 706"
    dayanak_alintisi: "Taşınmaz mülkiyetinin devrini amaçlayan sözleşmelerin geçerli olması, resmî şekilde düzenlenmiş bulunmalarına bağlıdır."
    tanim: "Taşınmaz mülkiyetinin devrini amaçlayan sözleşmelerin geçerli olabilmesi için kanunen resmî şekilde düzenlenmesi zorunluluğudur."
    puf:
      - "Taşınmaz mülkiyetinin devrini amaçlayan sözleşmeler resmî şekilde düzenlenmiş bulunmadıkça geçerli olmaz."
      - "Ölüme bağlı tasarruflar ve mal rejimi sözleşmeleri, genel resmî şekilden ayrı kendilerine özgü şekillere tabidir."
    kontrol: "2026-10-18"
    inceleme: "duzeltildi"
    inceleme_notu: "puf[1]'de md. 706 metninde olmayan 'adi yazılı / noter onaysız' ifadeleri yerine md. 706/2'de yer alan 'ölüme bağlı tasarruflar ve mal rejimi sözleşmelerinin kendilerine özgü şekillere tabi olduğu' istisnası işlendi."

  - terim: "HEYELAN BÖLGESİ"
    kategori_kodu: "TAPU_VE_HUKUK"
    mevzuat: "4721 sayılı Kanun md. 710"
    dayanak_alintisi: "Arazi kaymasının sınır değişikliğine yol açmayacağı ilkesi, yetkili makamlarca heyelân bölgesi olduğu belirlenen yörelerde uygulanmaz."
    tanim: "Yetkili makamlarca belirlenen ve arazi kaymasının sınır değişikliğine yol açmayacağı kuralının uygulanmadığı yörelerdeki arazidir."
    puf:
      - "Heyelan bölgeleri yetkili makamlarca belirlenirken ilgili yöredeki arazinin yapısı doğrudan göz önünde tutulur."
      - "Taşınmazın heyelan bölgesinde bulunduğu ilgililere bildirilir ve tapu kütüğünün beyanlar sütununa resmen yazılır."
    kontrol: "2026-10-18"
    inceleme: "duzeltildi"
    inceleme_notu: "puf[0]'daki md. 711 konusuna kayan 'sınırın tespiti yeniden yapılır' ifadesi yerine md. 710/2'deki yöre arazisinin yapısının gözetilmesi kuralı getirildi; puf[1]'de beyanlar sütununa tescil ve ilgililere bildirim vurgusu korundu."

  - terim: "OLAĞAN ZAMANAŞIMI"
    kategori_kodu: "TAPU_VE_HUKUK"
    mevzuat: "4721 sayılı Kanun md. 712"
    dayanak_alintisi: "Geçerli bir hukukî sebep olmaksızın tapu kütüğüne malik olarak yazılan kişi, taşınmaz üzerindeki zilyetliğini davasız ve aralıksız olarak on yıl süreyle ve iyiniyetle sürdürürse, onun bu yolla kazanmış olduğu mülkiyet hakkına itiraz edilemez."
    tanim: "Geçerli hukuki sebep olmaksızın tapuda malik yazılan kişinin, davasız, aralıksız ve 10 yıl iyiniyetli zilyetlikle mülkiyet kazanmasıdır."
    puf:
      - "Taşınmaz üzerindeki zilyetliğin davasız ve aralıksız olarak tam on yıl boyunca iyiniyetle sürdürülmesi zorunludur."
      - "Bu şartlar gerçekleştiğinde, kişinin bu yolla kazanmış olduğu taşınmaz mülkiyeti hakkına artık itiraz edilemez."
    kontrol: "2026-10-18"
    inceleme: "duzeltildi"
    inceleme_notu: "puf[0]'ın tanımı tekrar etmesi önlendi, 10 yıllık davasız ve aralıksız zilyetlik koşulu netleştirildi; puf[1]'e kanunun bağladığı temel hukuki sonuç olan mülkiyete artık itiraz edilemeyeceği hükmü işlendi."
