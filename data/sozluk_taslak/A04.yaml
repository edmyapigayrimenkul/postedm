kartlar:
  - terim: "TAŞINMAZ REHNİ"
    kategori_kodu: TAPU_VE_HUKUK
    tanim: "Bir alacağı teminat altına almak amacıyla taşınmaz üzerinde kanunda sayılı şekillerde kurulan sınırlı ayni haktır."
    puf:
      - "Taşınmaz rehni ancak ipotek, ipotekli borç senedi veya irat senedi şeklinde kurulabilir; başka tür kurulamaz."
      - "Taşınmaz rehni ancak tapuya kayıtlı taşınmazlar üzerinde kurulabilir; tapusuz taşınmazda rehin kurulamaz."
    mevzuat: "Türk Medeni Kanunu md. 850 ve 853"
    dayanak_alintisi: "Taşınmaz rehni, ancak ipotek, ipotekli borç senedi veya irat senedi şeklinde kurulabilir."
    kontrol: "2026-10-18"
    inceleme: duzeltildi
    inceleme_notu: "Mevzuata md. 853 eklendi; tapuya kayıtlı olma zorunluluğu puf[1] yapıldı; sınırlı sayı ilkesi netleştirildi."

  - terim: "REHİNDE ÜST SINIR"
    kategori_kodu: TAPU_VE_HUKUK
    tanim: "Taşınmaz rehninin, alacak miktarı belirsiz veya değişken ise bütün istemleri karşılayacak üst sınırla kurulması kuralıdır."
    puf:
      - "Alacağın miktarı belli değilse taşınmazın güvence altına alacağı üst sınır taraflarca tescilde belirtilir."
      - "Kredi kuruluşlarının yabancı para kredilerini güvenceye almak için yabancı para üzerinden de rehin kurulabilir."
    mevzuat: "Türk Medeni Kanunu md. 851"
    dayanak_alintisi: "Taşınmaz rehni, miktarı Türk parası ile gösterilen belli bir alacak için kurulabilir. Alacağın miktarının belli olmaması hâlinde, alacaklının bütün istemlerini karşılayacak şekilde taşınmazın güvence altına alacağı üst sınır taraflarca belirtilir."
    kontrol: "2026-10-18"
    inceleme: duzeltildi
    inceleme_notu: "Tanım ve puf cümleleri TMK md. 851 lafzına uyarlandı; kredi kuruluşları için yabancı para ipoteği kuralı netleştirildi."

  - terim: "REHNİN RESMÎ ŞEKLİ"
    kategori_kodu: TAPU_VE_HUKUK
    tanim: "Taşınmaz rehni sözleşmesinin geçerliliğinin resmî memur önünde düzenlenmesine ve tapuya tescile bağlı olması kuralıdır."
    puf:
      - "Taşınmaz rehninin kurulmasına ilişkin sözleşmenin geçerliliği resmî şekilde yapılmış olmasına bağlıdır."
      - "Kanunda öngörülen ayrık durumlar (kanuni ipotekler) saklı kalmak üzere rehin tapu kütüğüne tescil ile kurulur."
    mevzuat: "Türk Medeni Kanunu md. 856"
    dayanak_alintisi: "Taşınmaz rehni tapu kütüğüne tescil ile kurulur. Kanunda öngörülen ayrık durumlar saklıdır. Taşınmaz rehninin kurulmasına ilişkin sözleşmenin geçerliliği, resmî şekilde yapılmış olmasına bağlıdır."
    kontrol: "2026-10-18"
    inceleme: duzeltildi
    inceleme_notu: "Tanım tam cümle yapıldı; ayrık durumlar (kanuni ipotekler) saklı tutularak md. 856'ya tam uyum sağlandı."

  - terim: "İPOTEK"
    kategori_kodu: TAPU_VE_HUKUK
    tanim: "Mevcut veya henüz doğmamış olmakla beraber doğması olası bir alacağı güvence altına alan taşınmaz rehni türüdür."
    puf:
      - "İpoteğe konu olacak taşınmazın borçlunun mülkiyetinde bulunması kanunen gerekmez."
      - "Alacak sona erince ipotekli taşınmazın maliki alacaklıdan ipoteğin tapuda terkin edilmesini isteyebilir."
    mevzuat: "Türk Medeni Kanunu md. 881 ve 883"
    dayanak_alintisi: "Hâlen mevcut olan veya henüz doğmamış olmakla beraber doğması kesin veya olası bulunan herhangi bir alacak, ipotekle güvence altına alınabilir. İpoteğe konu olacak taşınmazın, borçlunun mülkiyetinde bulunması gerekmez."
    kontrol: "2026-10-18"
    inceleme: duzeltildi
    inceleme_notu: "Puf tekrarı giderildi, mevzuata md. 883 dahil edilerek alacağın sona ermesiyle malikin terkin isteme hakkı puf[1] olarak eklendi."

  - terim: "İPOTEKLİ YERİN DEVRİ"
    kategori_kodu: TAPU_VE_HUKUK
    tanim: "İpotekli taşınmazın devredilmesi halinde asıl borçlunun sorumluluğunu ve rehin güvencesini düzenleyen temel kuraldır."
    puf:
      - "Aksi kararlaştırılmış olmadıkça taşınmazın devri borçlunun sorumluluğunda ve güvencede değişiklik yaratmaz."
      - "Yeni malik borcu yüklenir, alacaklı 1 yılda önceki borçluya yazılı bildirim yapmazsa borçlu borcundan kurtulur."
    mevzuat: "Türk Medeni Kanunu md. 888"
    dayanak_alintisi: "İpotekli taşınmazın devri, aksi kararlaştırılmış olmadıkça, borçlunun sorumluluğunda ve güvencede bir değişiklik meydana getirmez. Yeni malik borcu yüklendiği takdirde alacaklı, kendisine başvurma hakkını saklı tuttuğunu bir yıl içinde yazılı olarak önceki borçluya bildirmezse, borçlu borcundan kurtulur."
    kontrol: "2026-10-18"
    inceleme: duzeltildi
    inceleme_notu: "Tanım döngüselliği giderildi; puf[1] kanundaki 1 yıllık yazılı başvuru bildirimi şartına uyarlandı."

  - terim: "REHİN DERECESİ"
    kategori_kodu: TAPU_VE_HUKUK
    tanim: "Taşınmaz rehninde alacaklıların tatmin sırasını ve tescil edilen güvence sınırını belirleyen resmi öncelik basamağıdır."
    puf:
      - "Rehnin sağladığı güvence ve öncelik hakkı, tapu tescilinde belirtilen rehin derecesi ile sınırlıdır."
      - "Önceki derecenin miktarı tescilde gösterilmek kaydıyla ikinci veya daha sonraki derecede de rehin kurulabilir."
    mevzuat: "Türk Medeni Kanunu md. 870"
    dayanak_alintisi: "Rehnin sağladığı güvence, tescilde belirtilen rehin derecesi ile sınırlıdır. Taşınmaz rehni, sırada kendisinden önce gelecek olanın miktarının tescilde belirtilmesi kaydıyla ikinci veya daha sonraki derecede de kurulabilir."
    kontrol: "2026-10-18"
    inceleme: duzeltildi
    inceleme_notu: "Tanım ile puf[0] mükerrerliği giderildi; tatmin sırası ve ikinci derecede rehin kurma şartı kanun lafzıyla netleştirildi."

  - terim: "BOŞ DERECE KURALI"
    kategori_kodu: TAPU_VE_HUKUK
    tanim: "Önceki sıradaki rehin terkin edilse bile sonraki alacaklının kendiliğinden boş dereceye ilerleyememesi ilkesidir."
    puf:
      - "Terkin edilen rehin hakkı yerine malik tarafından serbestçe yeni bir rehin hakkı kurulabilir."
      - "Boşalan dereceye geçme sözleşmesinin geçerliliği resmî şekle, ayni etki sağlaması ise tapuya şerhe bağlıdır."
    mevzuat: "Türk Medeni Kanunu md. 871"
    dayanak_alintisi: "Aynı taşınmaz üzerinde farklı sıralarda kurulmuş bulunan rehin haklarından birinin terkin edilmiş olması, sonraki sırada yer alan rehinli alacaklıya boşalan dereceye geçme hakkı vermez. Terkin edilen rehin hakkı yerine yeni bir rehin hakkı kurulabilir."
    kontrol: "2026-10-18"
    inceleme: duzeltildi
    inceleme_notu: "Puf[1]'deki geçerlilik ve ayni etki ayrımı (resmî şekil ↔ tapu şerhi) TMK md. 871 fıkra 2'ye tam sadakatle düzeltildi."

  - terim: "İPOTEKLİ BORÇ SENEDİ"
    kategori_kodu: TAPU_VE_HUKUK
    tanim: "Taşınmaz rehniyle güvence altına alınmış kişisel bir alacak meydana getiren kıymetli evrak niteliğindeki rehin senedidir."
    puf:
      - "İpotekli borç senedi yoluyla rehin kurulabilmesi için tapu idaresince taşınmaza resmen değer biçilir."
      - "Tapu idaresince resmen biçilmiş değeri aşan miktar için ipotekli borç senedi yoluyla rehin kurulamaz."
    mevzuat: "Türk Medeni Kanunu md. 898 ve 899"
    dayanak_alintisi: "İpotekli borç senedi, taşınmaz rehniyle güvence altına alınmış kişisel bir alacak meydana getirir."
    kontrol: "2026-10-18"
    inceleme: duzeltildi
    inceleme_notu: "Mevzuata md. 899 eklendi; taslaktaki serbest ve dayanaksız tedavül yorumu yerine kanunun emredici resmi değer biçme ve biçilen değeri aşamama kuralı puf maddelerine işlendi."

  - terim: "KAYNAK HAKKI"
    kategori_kodu: TAPU_VE_HUKUK
    tanim: "Başkasının arazisinde bulunan su kaynağından su alma ve bu suyu kendi arazisine akıtma yetkisi veren irtifak hakkıdır."
    puf:
      - "Aksi kararlaştırılmış olmadıkça bu irtifak hakkı başkasına devredilebilir ve mirasçılara geçer."
      - "Bağımsız nitelikte ve en az 30 yıl için kurulmuş ise tapu kütüğüne taşınmaz olarak kaydedilebilir."
    mevzuat: "Türk Medeni Kanunu md. 837"
    dayanak_alintisi: "Başkasının arazisinde bulunan kaynak üzerinde irtifak hakkı, bu arazinin malikini suyun alınmasına ve akıtılmasına katlanmakla yükümlü kılar. Bu hak, aksi kararlaştırılmış olmadıkça, başkasına devredilebilir ve mirasçıya geçer."
    kontrol: "2026-10-18"
    inceleme: duzeltildi
    inceleme_notu: "Puf[0]'daki tanım tekrarı kaldırıldı, yerine md. 837 fıkra 2'deki devredilebilirlik ve mirasçılara geçiş kuralı işlendi."
