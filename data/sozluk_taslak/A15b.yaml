  inceleme: red
  inceleme_notu: "(1) puf[0] ('Hapis hakkı kişiye değil, taşınırlara ilişkindir') md. 336-337'de yok; yazarın eklemesi. (2) Hakkın nasıl kullanılacağı md. 338'de: kiracı taşınmak ya da eşyayı başka yere götürmek isterse kiraya veren, alacağını güvenceye alacak kadar taşınırı ancak sulh hâkiminin veya icra müdürünün kararıyla alıkoyabilir. Kart bunu vermediği ve tanım hakkın ne sağladığını söylemediği ('... taşınırlar üzerindeki hakkıdır', 'hapis' sözcüğü de açıklanmıyor) için okur kiraya verenin eşyayı kendiliğinden tutabileceğini sanabilir; eksik bırakarak yanıltma, kapsam zinciri. (3) Dayanak alıntısı (haczedilemeyen mallar cümlesi) tanımdaki asıl iddiayı (güvence konusu, bir yıllık ve altı aylık kira) desteklemiyor; destekleyen cümle md. 336'nın ilk cümlesi. (4) puf[2] md. 337'yi daraltıyor: çalınmış, kaybolmuş ya da malikinin elinden iradesi dışında çıkmış eşya düşmüş; 'bilinen' edilgen kaldığı için bilmesi gerekenin kiraya veren olduğu kaybolmuş. Alt kiracının eşyasına uzanma (md. 336, 2. cümle) ve üçüncü kişi eşyasını öğrenip en yakın fesih dönemi sonu için feshetmeyen kiraya verenin hakkını kaybetmesi (md. 337, 2. cümle) de yok. Kurtarmak tanımın, alıntının ve pufların yeniden yazılmasını ve md. 338 atfını gerektiriyor; küçük düzeltme değil."
