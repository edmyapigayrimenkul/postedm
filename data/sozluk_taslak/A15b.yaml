  kontrol: '2026-10-13'
  inceleme: red
  inceleme_notu: "(1) Kapsam başka maddede değişiyor: ürün kirasında kiracının iflasıyla sözleşme iflasın açıldığı anda kendiliğinden sona erer; kiraya veren ancak işlemekte olan kira ve tutanaktaki eşya için yeterli güvence verilirse sözleşmeyi kira yılı sonuna kadar sürdürmekle yükümlüdür (md. 370). Kart md. 332'yi her kira için genel kural gibi sunuyor; ürün kirasında (ör. işletme ya da tarımsal taşınmaz kirası) sonuç tersine döner. (2) Konut ve çatılı işyeri kiralarında fesih bildirimi yazılı olmazsa geçersiz (md. 348); kart 'hemen feshedebilir' derken bu şekil koşulunu vermiyor. (3) puf[1] 121 karakter; 'iflas masası' gündelik okur için açıklamasız teknik terim. Kurtarmak için tanım 'ürün kirası dışında' diye sınırlanmalı (md. 370 atfıyla) ve md. 348 eklenmeli; bunlar yeni atıf ve madde gerektirdiğinden inceleme sırasında yapılmadı."
